<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, serif" font-size="13">

  <!-- Background -->
  <rect width="900" height="600" fill="#f8f7f4"/>

  <!-- ── EDOP box ── -->
  <rect x="30" y="30" width="270" height="380" rx="10" fill="#e8f0e8" stroke="#4a7a4a" stroke-width="2"/>
  <text x="165" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a2d">EDOP</text>
  <text x="165" y="76" text-anchor="middle" font-size="11" fill="#4a7a4a">Environmental Dimensions of Place</text>

  <text x="50" y="108" font-size="12" font-weight="bold" fill="#333">Data Sources</text>
  <text x="58" y="128" font-size="11" fill="#444">• BasinATLAS / HydroATLAS</text>
  <text x="58" y="146" font-size="11" fill="#444">• HydroRIVERS</text>
  <text x="58" y="164" font-size="11" fill="#444">• LMR v2.1 (paleoclimate)</text>
  <text x="58" y="182" font-size="11" fill="#444">• eVolv2k v4 (volcanism)</text>
  <text x="58" y="200" font-size="11" fill="#444">• OneEarth ecoregions</text>
  <text x="58" y="218" font-size="11" fill="#888">• ICOADS (Phase 2, coastal)</text>

  <line x1="165" y1="230" x2="165" y2="258" stroke="#4a7a4a" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="60" y="260" width="210" height="44" rx="6" fill="#4a7a4a"/>
  <text x="165" y="278" text-anchor="middle" font-size="11" fill="white">Signature computation</text>
  <text x="165" y="295" text-anchor="middle" font-size="10" fill="#c8e8c8">basin level · bands A–F · s/u duality</text>

  <line x1="165" y1="306" x2="165" y2="334" stroke="#4a7a4a" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="60" y="336" width="210" height="44" rx="6" fill="#2d5a2d"/>
  <text x="165" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="white">EDOPS</text>
  <text x="165" y="371" text-anchor="middle" font-size="10" fill="#c8e8c8">structured JSON signature · API</text>

  <!-- ── CDOP box ── -->
  <rect x="600" y="30" width="270" height="380" rx="10" fill="#e8eaf4" stroke="#4a4a8a" stroke-width="2"/>
  <text x="735" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d2d6a">CDOP</text>
  <text x="735" y="76" text-anchor="middle" font-size="11" fill="#4a4a8a">Cultural Dimensions of Place</text>

  <text x="618" y="108" font-size="12" font-weight="bold" fill="#333">Cultural Datasets</text>
  <text x="626" y="128" font-size="11" fill="#444">• D-PLACE (1,291 EA societies)</text>
  <text x="626" y="146" font-size="11" fill="#444">• Seshat (329 polities + Cliopatria)</text>
  <text x="626" y="164" font-size="11" fill="#444">• HYDE (population, land use)</text>
  <text x="626" y="182" font-size="11" fill="#888">• WHG (place records)</text>
  <text x="626" y="200" font-size="11" fill="#888">• Text corpora / embeddings</text>
  <text x="626" y="218" font-size="11" fill="#888">• Researcher-contributed data</text>

  <text x="618" y="252" font-size="12" font-weight="bold" fill="#333">Research Questions</text>
  <text x="626" y="272" font-size="11" fill="#888">• Culture ↔ environment dynamics</text>
  <text x="626" y="290" font-size="11" fill="#888">• Subsistence / complexity patterns</text>
  <text x="626" y="308" font-size="11" fill="#888">• Historical landscape change</text>
  <text x="626" y="326" font-size="10" fill="#aaa">  (future development)</text>

  <!-- ── Validation bridge ── -->
  <rect x="315" y="100" width="270" height="240" rx="8" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b6914">Validation</text>
  <text x="450" y="142" text-anchor="middle" font-size="10" fill="#8b6914">bounded · 3 datasets · specific experiments</text>

  <text x="328" y="168" font-size="10" fill="#555">• EDOPS vs. subsistence (D-PLACE)</text>
  <text x="328" y="186" font-size="10" fill="#555">• EDOPS vs. complexity vars (Seshat)</text>
  <text x="328" y="204" font-size="10" fill="#555">• EDOPS vs. population density (HYDE)</text>
  <text x="328" y="222" font-size="10" fill="#555">• Settlement hearth demonstrations</text>
  <text x="328" y="240" font-size="10" fill="#555">• Worked historical examples</text>
  <text x="328" y="258" font-size="10" fill="#888">  (Song, Yellow River, etc.)</text>

  <!-- Validation ↔ arrows -->
  <line x1="300" y1="210" x2="318" y2="210" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <line x1="582" y1="210" x2="600" y2="210" stroke="#b8860b" stroke-width="1.5" marker-start="url(#arrowYr)"/>

  <!-- ── ISHI scope boundary ── -->
  <rect x="18" y="18" width="552" height="430" rx="14" fill="none" stroke="#4a7a4a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="294" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a4a">◄── ISHI contract scope ──►</text>

  <!-- ── Application layer: 3 boxes ── -->

  <!-- Basic dashboard (in scope) -->
  <rect x="30" y="490" width="240" height="80" rx="8" fill="#e8f0e8" stroke="#4a7a4a" stroke-width="1.8"/>
  <text x="150" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a2d">Basic Dashboard</text>
  <text x="150" y="530" text-anchor="middle" font-size="10" fill="#4a7a4a">illustrative · eval results</text>
  <text x="150" y="546" text-anchor="middle" font-size="10" fill="#4a7a4a">bounded controls</text>
  <text x="150" y="562" text-anchor="middle" font-size="9" fill="#4a7a4a">in scope</text>

  <!-- Computing Place platform (Karl's own, future) -->
  <rect x="330" y="490" width="240" height="80" rx="8" fill="#f0f0e8" stroke="#8a8a4a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a5a2d">Computing Place Platform</text>
  <text x="450" y="530" text-anchor="middle" font-size="10" fill="#6a6a3a">consumes EDOPS + CDOP</text>
  <text x="450" y="546" text-anchor="middle" font-size="10" fill="#6a6a3a">Karl's own work</text>
  <text x="450" y="562" text-anchor="middle" font-size="9" fill="#999">outside ISHI scope</text>

  <!-- Bespoke tools for others -->
  <rect x="630" y="490" width="240" height="80" rx="8" fill="#f4f0f0" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="750" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">Bespoke Tools</text>
  <text x="750" y="530" text-anchor="middle" font-size="10" fill="#999">custom apps for others</text>
  <text x="750" y="546" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="750" y="562" text-anchor="middle" font-size="9" fill="#bbb">not in scope</text>

  <!-- Arrows down to app boxes -->
  <line x1="165" y1="382" x2="150" y2="488" stroke="#4a7a4a" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arrowGd)"/>
  <line x1="450" y1="342" x2="450" y2="488" stroke="#8a8a4a" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowOd)"/>
  <line x1="700" y1="250" x2="750" y2="488" stroke="#ccc" stroke-width="1.0" stroke-dasharray="3,3" marker-end="url(#arrowDd)"/>

  <!-- ── Arrowhead markers ── -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a7a4a"/>
    </marker>
    <marker id="arrowY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b8860b"/>
    </marker>
    <marker id="arrowYr" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#b8860b"/>
    </marker>
    <marker id="arrowGd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a7a4a"/>
    </marker>
    <marker id="arrowOd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a8a4a"/>
    </marker>
    <marker id="arrowDd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ccc"/>
    </marker>
  </defs>

</svg>
