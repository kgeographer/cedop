<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sandbox | Computing Place</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { font-size: 0.9rem; }
    #left-col  { position: sticky; top: 1rem; }
    #narrative-box { font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; }
    .param-row label { font-size: 0.8rem; color: #666; }
    .accordion-button { font-size: 0.85rem; padding: 0.4rem 0.75rem; }
    .accordion-body  { font-size: 0.8rem; padding: 0.5rem 0.75rem; }
    .spinner-border-sm { width: 1rem; height: 1rem; }
  </style>
</head>
<body>

<header class="ms-3 mb-2">
  <h4 class="d-flex align-items-center justify-content-between py-2 border-bottom">
    <span>
      <a href="/"><img src="/static/images/cp_01_800w.jpg" alt="Computing Place" style="height:48px;" class="me-2"></a>
      <a href="/edop" class="text-decoration-none text-reset">EDOP</a>
      <span class="text-muted mx-2">/</span>
      <span class="text-secondary">Sandbox</span>
    </span>
    <span class="badge rounded-pill bg-secondary fw-normal fs-6 me-3">researcher tool</span>
  </h4>
</header>

<div class="container-fluid px-3">
  <div class="row g-3">

    <!-- ===================== LEFT COLUMN ===================== -->
    <div class="col-md-4" id="left-col">

      <!-- Place lookup -->
      <div class="card mb-2">
        <div class="card-header fw-semibold">Place lookup</div>
        <div class="card-body p-2">
          <div class="input-group input-group-sm mb-2">
            <input type="text" id="sb-place-input" class="form-control" placeholder="Place name or lat, lon">
            <button class="btn btn-outline-primary" id="sb-resolve-btn">Resolve</button>
          </div>
          <div id="sb-resolve-status" class="text-muted small mb-2" style="display:none;"></div>
          <!-- Candidate list when multiple results -->
          <div id="sb-candidates" class="list-group list-group-flush small mb-2" style="display:none;"></div>
          <!-- Resolved place chip -->
          <div id="sb-place-chip" class="d-none align-items-center gap-2 mb-2">
            <span class="badge bg-primary" id="sb-place-name-badge"></span>
            <span class="text-muted small" id="sb-coords-display"></span>
            <button class="btn btn-link btn-sm p-0 text-danger" id="sb-clear-btn" title="Clear">&#x2715;</button>
          </div>

          <!-- Parameters -->
          <!-- Level + Bands inline -->
          <div class="d-flex gap-2 align-items-start mb-2">
            <div style="flex:0 0 auto;">
              <label class="form-label mb-0" style="font-size:0.78rem;color:#666;">Level</label>
              <select class="form-select form-select-sm" id="sb-level" style="width:auto;">
                <option value="8" selected>08</option>
                <option value="6" disabled>06</option>
              </select>
            </div>
            <div style="flex:1 1 auto;">
              <label class="form-label mb-0" style="font-size:0.78rem;color:#666;">Bands</label>
              <div class="dropdown">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle w-100 text-start"
                        type="button" id="bands-dropdown-btn"
                        data-bs-toggle="dropdown" data-bs-auto-close="outside"
                        aria-expanded="false">
                  <span id="bands-display" class="font-monospace">A B C D E</span>
                </button>
                <ul class="dropdown-menu p-2" style="min-width:210px;" aria-labelledby="bands-dropdown-btn">
                  <li class="d-flex gap-3 px-1 mb-1">
                    <a href="#" id="bands-select-all" class="small text-decoration-none">All</a>
                    <a href="#" id="bands-clear-all" class="small text-decoration-none">None</a>
                  </li>
                  <li><hr class="dropdown-divider my-1"></li>
                  <li><div class="form-check">
                    <input class="form-check-input sb-band-chk" type="checkbox" id="band-A" value="A" checked>
                    <label class="form-check-label" for="band-A">A — Physiographic</label>
                  </div></li>
                  <li><div class="form-check">
                    <input class="form-check-input sb-band-chk" type="checkbox" id="band-B" value="B" checked>
                    <label class="form-check-label" for="band-B">B — Hydroclimatic</label>
                  </div></li>
                  <li><div class="form-check">
                    <input class="form-check-input sb-band-chk" type="checkbox" id="band-C" value="C" checked>
                    <label class="form-check-label" for="band-C">C — Bioclimatic</label>
                  </div></li>
                  <li><div class="form-check">
                    <input class="form-check-input sb-band-chk" type="checkbox" id="band-D" value="D" checked>
                    <label class="form-check-label" for="band-D">D — Anthropocene</label>
                  </div></li>
                  <li><div class="form-check">
                    <input class="form-check-input sb-band-chk" type="checkbox" id="band-E" value="E" checked>
                    <label class="form-check-label" for="band-E">E — Coastality</label>
                  </div></li>
                  <li><hr class="dropdown-divider my-1"></li>
                  <li><div class="form-check">
                    <input class="form-check-input sb-band-chk" type="checkbox" id="band-F" value="F">
                    <label class="form-check-label" for="band-F">F — Temporal <span class="text-muted">(needs range)</span></label>
                  </div></li>
                </ul>
              </div>
            </div>
          </div>
          <!-- F-band year inputs — shown when F is checked -->
          <div id="f-year-row" class="d-none mb-2">
            <div class="d-flex gap-1 align-items-center">
              <input type="number" id="f-year-start" class="form-control form-control-sm" style="width:72px" placeholder="from" min="0" max="1998">
              <span class="text-muted small">–</span>
              <input type="number" id="f-year-end" class="form-control form-control-sm" style="width:72px" placeholder="to" min="0" max="1998">
              <input type="number" id="f-vssi-min" class="visually-hidden" value="5" min="0" step="1">
            </div>
          </div>

          <button class="btn btn-primary btn-sm w-100" id="sb-sig-btn" disabled>
            Get signature
          </button>
        </div>
      </div>

      <!-- LLM thoughts button + narrative -->
      <div class="card mb-2" id="sb-narrative-card" style="display:none;">
        <div class="card-header fw-semibold d-flex justify-content-between align-items-center">
          <span>LLM interpretation</span>
          <button class="btn btn-outline-secondary btn-sm" id="sb-narrative-btn">
            <i class="bi bi-stars"></i> Generate
          </button>
        </div>
        <div class="card-body p-2">
          <div class="text-muted small mb-1 d-none" id="sb-narrative-hint">
            Using Band F time range for temporal context.
          </div>
          <div id="sb-narrative-status" class="text-muted small mb-1" style="display:none;"></div>
          <div id="narrative-box" class="text-secondary"></div>
        </div>
      </div>

      <!-- Signature summary -->
      <div id="sb-summary-card" class="card" style="display:none;">
        <div class="card-header fw-semibold">Summary</div>
        <div class="card-body p-2">
          <div id="sb-summary"></div>
        </div>
      </div>

    </div><!-- /left col -->

    <!-- ===================== RIGHT COLUMN ===================== -->
    <div class="col-md-8">

      <!-- Sig status / placeholder -->
      <div id="sb-right-placeholder" class="text-muted text-center py-5">
        <i class="bi bi-geo-alt fs-1 d-block mb-2"></i>
        Resolve a place and get its signature to begin.
      </div>

      <!-- Signature accordions -->
      <div id="sb-sig-panel" style="display:none;">
        <div class="d-flex justify-content-between align-items-baseline mb-2">
          <h5 id="sb-sig-heading" class="mb-0"></h5>
          <span class="text-muted small" id="sb-basin-meta"></span>
        </div>
        <div id="sb-accordions"></div>
      </div>

    </div><!-- /right col -->
  </div><!-- /row -->
</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
(() => {
  // ── State ──────────────────────────────────────────────────────────────
  let resolvedLat = null;
  let resolvedLon = null;
  let resolvedName = null;
  let currentSig = null;

  // ── Helpers ────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function humanizeKey(k) {
    return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
  function formatValue(v) {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'object') return JSON.stringify(v);
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : v.toFixed(3);
    return String(v);
  }
  function setStatus(elId, msg, show = true) {
    const el = document.getElementById(elId);
    if (!el) return;
    el.textContent = msg;
    el.style.display = show ? '' : 'none';
  }

  // ── Place resolution ───────────────────────────────────────────────────
  const placeInput    = document.getElementById('sb-place-input');
  const resolveBtn    = document.getElementById('sb-resolve-btn');
  const sigBtn        = document.getElementById('sb-sig-btn');
  const clearBtn      = document.getElementById('sb-clear-btn');
  const placeChip     = document.getElementById('sb-place-chip');
  const candidatesEl  = document.getElementById('sb-candidates');

  let whgResults = [];

  resolveBtn.addEventListener('click', resolvePlace);
  placeInput.addEventListener('keydown', e => { if (e.key === 'Enter') resolvePlace(); });
  clearBtn.addEventListener('click', clearPlace);

  async function resolvePlace() {
    const q = placeInput.value.trim();
    if (!q) return;

    // Direct lat,lon entry
    const coordMatch = q.match(/^(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)$/);
    if (coordMatch) {
      setResolved(parseFloat(coordMatch[1]), parseFloat(coordMatch[2]), q);
      return;
    }

    // WHG reconcile — returns candidate list with lat/lon/countries
    hideCandidates();
    setStatus('sb-resolve-status', 'Searching WHG…');
    try {
      const res = await fetch(`/api/whg-reconcile?q=${encodeURIComponent(q)}&size=10`);
      if (!res.ok) throw new Error(`WHG search failed (${res.status})`);
      const data = await res.json();
      whgResults = data.results || [];
      if (!whgResults.length) {
        setStatus('sb-resolve-status', `No results found for "${q}".`);
        return;
      }
      setStatus('sb-resolve-status', '', false);
      showCandidates(whgResults);
    } catch (err) {
      setStatus('sb-resolve-status', `Error: ${err.message}`);
    }
  }

  function showCandidates(results) {
    const html = results.map((r, idx) => {
      const name    = escapeHtml(r.name);
      const ccodes  = (r.countries || []).map(c => c.code).join(', ');
      const badge   = r.match ? ' <span class="badge bg-success" style="font-size:0.7rem;">exact</span>' : '';
      const type    = (r.types && r.types[0]) ? `<span class="text-muted ms-1" style="font-size:0.75rem;">${escapeHtml(r.types[0].label)}</span>` : '';
      const alts    = (!r.match && r.alt_names && r.alt_names.length)
        ? `<div class="text-muted" style="font-size:0.75rem;">aka: ${r.alt_names.slice(0,3).map(escapeHtml).join(', ')}</div>`
        : '';
      const hasCoords = r.lat && r.lon;
      const dimStyle = !hasCoords ? ' style="opacity:0.5;cursor:default;pointer-events:none;"' : '';
      return `
        <a href="#" class="list-group-item list-group-item-action py-1 px-2 whg-candidate"${dimStyle} data-idx="${idx}">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="fw-semibold">${idx+1}. ${name}</span>${badge}
              ${ccodes ? ` <span class="text-muted">[${ccodes}]</span>` : ''}
              ${type}
              ${alts}
              ${!hasCoords ? '<div class="text-muted" style="font-size:0.72rem;">(no geometry)</div>' : ''}
            </div>
          </div>
        </a>`;
    }).join('');
    candidatesEl.innerHTML = html;
    candidatesEl.style.display = '';

    candidatesEl.querySelectorAll('.whg-candidate[data-idx]').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const place = whgResults[idx];
        if (!place.lat || !place.lon) return;
        setResolved(place.lat, place.lon, place.name);
      });
    });
  }

  function hideCandidates() {
    candidatesEl.style.display = 'none';
    candidatesEl.innerHTML = '';
    whgResults = [];
  }

  function setResolved(lat, lon, name) {
    resolvedLat = lat; resolvedLon = lon; resolvedName = name;
    document.getElementById('sb-place-name-badge').textContent = name;
    document.getElementById('sb-coords-display').textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    placeChip.classList.replace('d-none', 'd-flex');
    sigBtn.disabled = false;
    hideCandidates();
    setStatus('sb-resolve-status', '', false);
  }

  function clearPlace() {
    resolvedLat = resolvedLon = resolvedName = currentSig = null;
    placeInput.value = '';
    placeChip.classList.replace('d-flex', 'd-none');
    sigBtn.disabled = true;
    hideCandidates();
    document.getElementById('sb-right-placeholder').style.display = '';
    document.getElementById('sb-sig-panel').style.display = 'none';
    document.getElementById('sb-summary-card').style.display = 'none';
    document.getElementById('sb-narrative-card').style.display = 'none';
  }

  // ── Bands dropdown ─────────────────────────────────────────────────────
  function updateBandsDisplay() {
    const selected = Array.from(document.querySelectorAll('.sb-band-chk:checked')).map(c => c.value);
    document.getElementById('bands-display').textContent =
      selected.length ? selected.join(' ') : '—';
    // Show F year row if F is selected
    document.getElementById('f-year-row').classList.toggle('d-none', !selected.includes('F'));
    const hint = document.getElementById('sb-narrative-hint');
    if (hint) hint.classList.toggle('d-none', !selected.includes('F'));
  }

  document.querySelectorAll('.sb-band-chk').forEach(cb => {
    cb.addEventListener('change', updateBandsDisplay);
  });

  document.getElementById('bands-select-all').addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.sb-band-chk').forEach(cb => { cb.checked = true; });
    updateBandsDisplay();
  });

  document.getElementById('bands-clear-all').addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.sb-band-chk').forEach(cb => { cb.checked = false; });
    updateBandsDisplay();
  });

  // ── Signature ──────────────────────────────────────────────────────────
  sigBtn.addEventListener('click', fetchSignature);

  async function fetchSignature() {
    if (resolvedLat === null) return;

    const sigBands = Array.from(document.querySelectorAll('.sb-band-chk:checked'))
      .map(cb => cb.value).filter(v => v !== 'F').join('');
    const wantF   = document.getElementById('band-F').checked;
    const ys      = document.getElementById('f-year-start').value.trim();
    const ye      = document.getElementById('f-year-end').value.trim();

    if (!sigBands && !wantF) { alert('Select at least one band.'); return; }
    if (wantF && (!ys || !ye)) { alert('Band F requires a year range (from – to).'); return; }

    const level = document.getElementById('sb-level').value;
    sigBtn.disabled = true;
    sigBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Loading…';

    try {
      let sig = null, temporalData = null;

      if (sigBands) {
        const res = await fetch(`/api/signature?lat=${resolvedLat}&lon=${resolvedLon}&bands=${sigBands}&level=${level}`);
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Signature request failed'); }
        sig = await res.json();
        currentSig = sig;
      }

      if (wantF) {
        const vmin = document.getElementById('f-vssi-min').value || 5;
        const tres = await fetch(`/api/temporal?lat=${resolvedLat}&lon=${resolvedLon}&year_start=${ys}&year_end=${ye}&vssi_min=${vmin}`);
        if (!tres.ok) { const e = await tres.json(); throw new Error(e.detail || 'Temporal request failed'); }
        temporalData = await tres.json();
      }

      renderSignature(sig, temporalData);
    } catch (err) {
      alert(`Error: ${err.message}`);
    } finally {
      sigBtn.disabled = false;
      sigBtn.innerHTML = 'Get signature';
    }
  }

  function buildAccordionPanel(code, label, body, isFirst, accId) {
    const hId = `sb-h-${code}`, cId = `sb-c-${code}`;
    return `
      <div class="accordion-item">
        <h2 class="accordion-header" id="${hId}">
          <button class="accordion-button ${isFirst?'':'collapsed'}" type="button"
                  data-bs-toggle="collapse" data-bs-target="#${cId}"
                  aria-expanded="${isFirst}" aria-controls="${cId}">
            ${escapeHtml(code)} — ${escapeHtml(label)}
          </button>
        </h2>
        <div id="${cId}" class="accordion-collapse collapse ${isFirst?'show':''}"
             aria-labelledby="${hId}" data-bs-parent="#${accId}">
          <div class="accordion-body p-2">${body}</div>
        </div>
      </div>`;
  }

  function buildTemporalBody(data) {
    const gc = data.grid_cell;
    let html = `<div class="small mb-2">
      <strong>Grid cell</strong>: ${gc.lat}N, ${gc.lon}E &nbsp;|&nbsp;
      <strong>Period</strong>: ${data.year_start}–${data.year_end} CE &nbsp;|&nbsp;
      PDSI mean <strong>${data.pdsi_mean}</strong>
      &nbsp; min <strong>${data.pdsi_min}</strong>
      &nbsp; max <strong>${data.pdsi_max}</strong>
    </div>`;

    if (data.volcanic_events && data.volcanic_events.length) {
      const rows = data.volcanic_events.map(e =>
        `<tr><td>${e.year_ad}</td><td>${e.vssi_tg}</td><td>${e.vssi_1sig ?? '—'}</td>
         <td>${e.asymmetry !== null ? e.asymmetry.toFixed(2) : '—'}</td>
         <td>${e.location || 'unknown'}</td><td>${e.tephra ? 'Y' : 'N'}</td></tr>`
      ).join('');
      html += `<div class="text-muted small mb-1">Volcanic events (vssi ≥ threshold)</div>
        <table class="table table-sm table-bordered mb-2" style="font-size:0.78rem;">
          <thead class="table-light">
            <tr><th>Year</th><th>vssi (Tg)</th><th>±1σ</th><th>Asym.</th><th>Location</th><th>Tephra</th></tr>
          </thead><tbody>${rows}</tbody>
        </table>`;
    } else {
      html += `<div class="text-muted small mb-2">No volcanic events above threshold in this period.</div>`;
    }

    const series = data.pdsi_series || [];
    if (series.length) {
      const decades = {};
      series.forEach(({year, pdsi}) => {
        const d = Math.floor(year / 10) * 10;
        if (!decades[d]) decades[d] = [];
        decades[d].push(pdsi);
      });
      const lines = Object.entries(decades).map(([d, vals]) => {
        const mean = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(3);
        const bar  = (parseFloat(mean) >= 0 ? '+' : '-')
          + '█'.repeat(Math.min(Math.round(Math.abs(parseFloat(mean))*20), 12));
        return `${d}s  ${mean.padStart(7)}  ${bar}`;
      });
      html += `<div class="text-muted small mb-1">PDSI series (annual, ensemble mean)</div>
        <div class="small font-monospace" style="max-height:200px;overflow-y:auto;">${escapeHtml(lines.join('\n'))}</div>`;
    }
    return html;
  }

  function renderSignature(sig, temporalData = null) {
    document.getElementById('sb-right-placeholder').style.display = 'none';
    document.getElementById('sb-sig-panel').style.display = '';
    document.getElementById('sb-narrative-card').style.display = sig ? '' : 'none';
    document.getElementById('sb-summary-card').style.display = sig ? '' : 'none';

    document.getElementById('sb-sig-heading').textContent =
      resolvedName ? `${resolvedName} — environmental signature` : 'Environmental signature';
    document.getElementById('sb-basin-meta').textContent =
      sig ? `Basin ${sig.id ?? ''}  ·  ${sig.ecoregion ?? ''}` : '';

    if (sig) {
      const summaryEl = document.getElementById('sb-summary');
      const items = Array.isArray(sig.profile_summary) ? sig.profile_summary : [];
      summaryEl.innerHTML = items.map(it =>
        `<div class="d-flex justify-content-between gap-2 py-1 border-bottom">
           <div class="text-muted">${escapeHtml(it.label || humanizeKey(it.key || ''))}</div>
           <div class="text-end">${escapeHtml(formatValue(it.value))}</div>
         </div>`
      ).join('') || '<div class="text-muted">No summary fields.</div>';
    }

    const accEl = document.getElementById('sb-accordions');
    const accId = 'sbAccordion';
    let panels = '';
    let first = true;

    if (sig) {
      const groups = sig.profile_groups || {};
      ['A','B','C','D','E'].filter(c => groups[c]).forEach(code => {
        const g = groups[code];
        const body = (g.items || []).map(it =>
          `<div class="d-flex justify-content-between gap-2 py-1 border-bottom">
             <div class="text-muted">${escapeHtml(it.label || humanizeKey(it.key || ''))}</div>
             <div class="text-end">${escapeHtml(formatValue(it.value))}</div>
           </div>`
        ).join('') || '<div class="text-muted">(no fields)</div>';
        panels += buildAccordionPanel(code, g.label || code, body, first, accId);
        first = false;
      });
    }

    if (temporalData) {
      panels += buildAccordionPanel('F', 'Temporal context (LMR PDSI + eVolv2k)', buildTemporalBody(temporalData), first, accId);
    }

    accEl.innerHTML = `<div class="accordion" id="${accId}">${panels}</div>`;
  }

  // ── Narrative ──────────────────────────────────────────────────────────
  document.getElementById('sb-narrative-btn').addEventListener('click', fetchNarrative);

  async function fetchNarrative() {
    if (!currentSig || resolvedLat === null) return;
    const btn = document.getElementById('sb-narrative-btn');
    const box = document.getElementById('narrative-box');
    const ys  = document.getElementById('f-year-start').value.trim();
    const ye  = document.getElementById('f-year-end').value.trim();

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>';
    setStatus('sb-narrative-status', 'Calling Claude API…');
    box.textContent = '';

    let url = `/api/narrative?lat=${resolvedLat}&lon=${resolvedLon}`;
    if (resolvedName) url += `&name=${encodeURIComponent(resolvedName)}`;
    if (ys && ye)     url += `&year_start=${ys}&year_end=${ye}`;

    try {
      const res = await fetch(url);
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
      const data = await res.json();
      box.textContent = data.narrative;
      setStatus('sb-narrative-status', '', false);
    } catch (err) {
      setStatus('sb-narrative-status', `Error: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-stars"></i> Regenerate';
    }
  }


})();
