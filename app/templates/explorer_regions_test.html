<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Regions test — MapLibre 6-panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <style>
    body { font-size: 0.9rem; padding: 1rem; background: #f8f9fa; }
    #controls { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    #timing { font-size: 0.8rem; color: #555; background: #fff; border: 1px solid #dee2e6;
              border-radius: 4px; padding: 0.3rem 0.7rem; min-width: 320px; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .panel { background: #fff; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; }
    .panel-label { font-size: 0.75rem; font-weight: 600; color: #444; padding: 3px 6px;
                   background: rgba(255,255,255,0.85); border-bottom: 1px solid #eee; }
    .map-container { height: 280px; }
  </style>
</head>
<body>

<h5 class="mb-2">Regions — MapLibre 6-panel performance test</h5>

<div id="controls">
  <div class="d-flex align-items-center gap-2">
    <label class="fw-semibold mb-0">Variable:</label>
    <select id="var-select" class="form-select form-select-sm" style="width:220px;">
      <option value="aridity_index">aridity_index</option>
      <option value="precipitation_annual">precipitation_annual</option>
      <option value="temperature_annual">temperature_annual</option>
      <option value="discharge_annual">discharge_annual</option>
      <option value="elevation_mean">elevation_mean</option>
    </select>
  </div>
  <button id="load-btn" class="btn btn-sm btn-primary">Load variable</button>
  <div id="timing">Waiting…</div>
</div>

<div id="grid"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js" crossorigin=""></script>
<script>
(async function () {

  // ── PMTiles protocol ──
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // ── Color helpers (same palette as explorer.html) ──
  const VIRIDIS = ['#440154','#443982','#31688e','#21918c','#35b779','#8fd744','#fde725'];
  const RDBU    = ['#b2182b','#ef8a62','#fddbc7','#f7f7f7','#d1e5f0','#67a9cf','#2166ac'];

  function lerpColor(c1, c2, t) {
    const h = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
    const [r1,g1,b1] = h(c1), [r2,g2,b2] = h(c2);
    return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
  }
  function interpPalette(pal, t) {
    const n = pal.length - 1, i = Math.min(n-1, Math.floor(t*n));
    return lerpColor(pal[i], pal[i+1], t*n - i);
  }
  function makeColorFn(meta, schemaKey) {
    const isDiverge = meta.min < 0;
    const lo = meta.p10 ?? meta.min, hi = meta.p90 ?? meta.max;
    if (isDiverge) {
      const absMax = Math.max(Math.abs(lo), Math.abs(hi)) || 1;
      return v => v == null ? '#d3d3d3' : interpPalette(RDBU, 1 - Math.max(0, Math.min(1, (v + absMax) / (2 * absMax))));
    }
    if (schemaKey === 'aridity_index' || schemaKey === 'precipitation_annual') {
      const range = (hi - lo) || 1;
      return v => v == null ? '#d3d3d3' : interpPalette(RDBU, Math.max(0, Math.min(1, (v - lo) / range)));
    }
    const range = (hi - lo) || 1;
    return v => v == null ? '#d3d3d3' : interpPalette(VIRIDIS, Math.max(0, Math.min(1, (v - lo) / range)));
  }

  // ── Fetch regions ──
  const regResp = await fetch('/api/explorer/regions');
  const { regions } = await regResp.json();

  // ── Build the 2×3 grid ──
  const grid = document.getElementById('grid');
  const maps = [];

  const BASE_STYLE = {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap contributors',
      }
    },
    layers: [{ id: 'osm-tiles', type: 'raster', source: 'osm' }]
  };

  for (const reg of regions) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `<div class="panel-label">${reg.label}</div>
                       <div class="map-container" id="map-${reg.id}"></div>`;
    grid.appendChild(panel);

    const m = new maplibregl.Map({
      container: `map-${reg.id}`,
      style: JSON.parse(JSON.stringify(BASE_STYLE)),  // clone — each instance needs its own object
      bounds: reg.bbox,
      fitBoundsOptions: { padding: 10 },
      attributionControl: false,
      logoPosition: 'bottom-left',
    });

    await new Promise(resolve => m.on('load', () => {
      m.addSource('basin06', {
        type: 'vector',
        url: 'pmtiles:///static/explorer/basin06.pmtiles',
      });
      m.addLayer({
        id: 'basin06-fill',
        type: 'fill',
        source: 'basin06',
        'source-layer': 'basin06',
        paint: {
          'fill-color':   ['coalesce', ['feature-state', 'fc'], '#d3d3d3'],
          'fill-opacity': 0.85,
        }
      });
      resolve();
    }));

    maps.push({ map: m, id: reg.id });
  }

  // ── Apply feature states to all maps ──
  async function loadAndApply(varKey) {
    const timing = document.getElementById('timing');
    timing.textContent = `Fetching ${varKey}…`;
    const t0 = performance.now();

    const resp = await fetch(`/api/explorer/values?var=${encodeURIComponent(varKey)}&level=6&su=s`);
    const data = await resp.json();
    const t1 = performance.now();

    if (!resp.ok) {
      timing.innerHTML = `<span style="color:#c00;">Error ${resp.status}: ${data.detail ?? 'unknown'}</span>`;
      return;
    }

    const colorFn = makeColorFn(data.meta, varKey);
    const values  = data.values;

    // Apply to all 6 maps
    const t2 = performance.now();
    for (const { map } of maps) {
      map.removeFeatureState({ source: 'basin06', sourceLayer: 'basin06' });
      for (const [id, val] of Object.entries(values)) {
        map.setFeatureState(
          { source: 'basin06', sourceLayer: 'basin06', id: Number(id) },
          { fc: colorFn(val) }
        );
      }
    }
    const t3 = performance.now();

    timing.innerHTML =
      `fetch <strong>${(t1-t0).toFixed(0)} ms</strong> · ` +
      `${Object.keys(values).length.toLocaleString()} basins · ` +
      `feature-state (6 maps) <strong>${(t3-t2).toFixed(0)} ms</strong> · ` +
      `total <strong>${(t3-t0).toFixed(0)} ms</strong>`;
  }

  document.getElementById('load-btn').addEventListener('click', () => {
    loadAndApply(document.getElementById('var-select').value);
  });

  // Load default on page open
  loadAndApply('aridity_index');

})();
</script>
</body>
</html>
