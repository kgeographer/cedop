<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explorer | Computing Place</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5K56B8BCD9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5K56B8BCD9');
  </script>
  <style>
    body { font-size: 1rem; }

    /* ── Layout ── */
    #ex-left  { position: sticky; top: 1rem; overflow-y: auto; max-height: calc(100vh - 5rem); }
    #ex-right { display: flex; flex-direction: column; }

    /* ── Placeholder borders (remove once filled in) ── */
    .ex-placeholder {
      border: 1px dashed #bbb;
      border-radius: 4px;
      color: #aaa;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Tabs ── */
    #ex-tabs .nav-link { font-size: 0.85rem; padding: 0.3rem 0.75rem; }
    #ex-tabs .nav-link.disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    /* ── Control strip ── */
    #ex-controls { font-size: 0.85rem; background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 0.35rem 0.6rem; flex-wrap: wrap; gap: 0.4rem; }

    /* ── Variable header strip ── */
    #ex-var-header {
      font-size: 0.8rem;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      padding: 0.3rem 0.6rem;
      min-height: 2rem;
    }

    /* ── Map ── */
    #ex-map { flex: 1; min-height: 420px; }

    /* ── Histogram strip ── */
    #ex-histogram { height: 110px; border-top: 1px solid #dee2e6; }

    /* ── eVolv2k panel (replaces map+histogram for evolv2k variables) ── */
    #ex-evolv-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #ex-evolv-chart {
      height: 260px;
      border-bottom: 1px solid #dee2e6;
      padding: 0.4rem 0.6rem 0.2rem;
    }
    #ex-evolv-table-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.4rem;
    }
    #ex-evolv-table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    #ex-evolv-table-wrap th { position: sticky; top: 0; background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 0.2rem 0.4rem; font-size: 0.72rem; cursor: pointer; user-select: none; }
    #ex-evolv-table-wrap th:hover { background: #e9ecef; }
    #ex-evolv-table-wrap td { padding: 0.15rem 0.4rem; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    #ex-evolv-table-wrap tr:hover td { background: #f5f8ff; }
    .evolv-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }

    /* ── Left column: search / filters ── */
    #ex-search-box { font-size: 0.85rem; }
    #ex-status-filter .btn { font-size: 0.8rem; padding: 0.2rem 0.5rem; }
    #ex-class-filter select { font-size: 0.8rem; }

    /* ── Accordion: bands ── */
    #ex-accordion .accordion-button {
      font-size: 0.8rem; padding: 0.35rem 0.6rem;
      background: #f0f4f8;
    }
    #ex-accordion .accordion-button:not(.collapsed) {
      background: #dce8f5; color: #1a3a5c; box-shadow: none;
    }
    #ex-accordion .accordion-button::after { margin-left: 0.4rem; }
    #ex-accordion .accordion-body { padding: 0.25rem 0.4rem; }

    /* ── Dimensions (details/summary) ── */
    .ex-dim { margin-bottom: 0.15rem; }
    .ex-dim > summary {
      cursor: pointer; list-style: none;
      font-size: 0.75rem; font-weight: 600; text-transform: capitalize;
      color: #555; padding: 0.2rem 0.4rem;
      border-radius: 3px; user-select: none;
    }
    .ex-dim > summary::-webkit-details-marker { display: none; }
    .ex-dim > summary::before {
      content: "▶ "; font-size: 0.6rem; color: #aaa;
    }
    .ex-dim[open] > summary::before { content: "▼ "; }
    .ex-dim > summary:hover { background: #eef; }

    /* ── Variable items ── */
    .ex-var-item {
      font-size: 0.78rem; padding: 0.18rem 0.5rem 0.18rem 1rem;
      cursor: pointer; border-radius: 3px; line-height: 1.4;
    }
    .ex-var-item:hover { background: #e8f0fe; }
    .ex-var-item.selected { background: #c8dcfa; font-weight: 600; }
    .ex-var-item.no-data {
      color: #bbb; cursor: default; font-style: italic;
    }
    .ex-var-item.no-data:hover { background: transparent; }
    .ex-var-item.preview { color: #777; }
    .ex-var-tag { font-size: 0.7rem; color: #888; }
    .ex-var-tag.preview-tag { color: #c87000; }
  </style>
</head>

<header class="mb-2">
  <h4 class="d-flex align-items-center justify-content-between py-2 border-bottom">
    <span>
      <a href="/"><img src="/static/images/cp_01_800w.jpg" alt="Computing Place" style="height:48px;" class="me-2"></a>
      <a href="/edops" class="text-decoration-none text-reset">EDOPS</a>
      <span class="me-1">Sandbox:</span>
      <a href="/sandbox/lookup" class="text-decoration-none text-secondary me-1">Lookup</a>
      <span class="text-muted me-1">|</span>
      <strong>Explorer</strong>
    </span>
    <span class="d-flex align-items-center gap-3">
      <span class="badge bg-secondary-subtle text-dark fw-normal" style="font-size:0.85rem;">EDOPS v0.3 Alpha</span>

  </h4>
</header>

  <div class="row g-3">

    <!-- ===================== LEFT COLUMN: variable selector ===================== -->

      <!-- Search -->

        <input type="text" id="ex-search-box" class="form-control form-control-sm"

      </div>

      <!-- Status filter -->
      <div id="ex-status-filter" class="btn-group w-100 mb-2" role="group" aria-label="Status filter">
        <input type="radio" class="btn-check" name="ex-status" id="ex-status-all" value="all" checked autocomplete="off">
        <label class="btn btn-outline-secondary" for="ex-status-all">All</label>
        <input type="radio" class="btn-check" name="ex-status" id="ex-status-impl" value="implemented" autocomplete="off">
        <label class="btn btn-outline-secondary" for="ex-status-impl">Implemented</label>
        <input type="radio" class="btn-check" name="ex-status" id="ex-status-plan" value="planned" autocomplete="off">

      <!-- Class filter -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
(function () {

  // ── Leaflet map + spinner overlay ──
  const map = L.map('ex-map', { zoomControl: true }).setView([20, 10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  // Pane for country borders — renders above all choropleth layers
  map.createPane('bordersPane');
  map.getPane('bordersPane').style.zIndex = 450;
  map.getPane('bordersPane').style.pointerEvents = 'none';

  const _spinner = document.createElement('div');
  _spinner.style.cssText = 'display:none;position:absolute;inset:0;background:rgba(255,255,255,0.6);z-index:999;align-items:center;justify-content:center;';
  _spinner.innerHTML = '<div class="spinner-border text-secondary" role="status"><span class="visually-hidden">Loading</span></div>';
  document.getElementById('ex-map').appendChild(_spinner);
  const showSpinner = () => { _spinner.style.display = 'flex'; };
  const hideSpinner = () => { _spinner.style.display = 'none'; };

  // ── Color palettes ──
  const VIRIDIS = ['#440154','#443982','#31688e','#21918c','#35b779','#8fd744','#fde725'];
  // RDBU: red→blue; for LMR use 1-t so blue=low, red=high (per spec)
  const RDBU = ['#b2182b','#ef8a62','#fddbc7','#f7f7f7','#d1e5f0','#67a9cf','#2166ac'];

  const LISA_COLORS = { HH: '#d32f2f', LL: '#1565c0', HL: '#ef9a9a', LH: '#90caf9', NS: '#e0e0e0' };
  const LISA_ORDER  = ['HH', 'HL', 'LH', 'LL', 'NS'];

  function lerpColor(c1, c2, t) {
    const h = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
    const [r1,g1,b1] = h(c1), [r2,g2,b2] = h(c2);
    return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
  }
  function interpPalette(pal, t) {
    const n = pal.length - 1, i = Math.min(n-1, Math.floor(t*n));
    return lerpColor(pal[i], pal[i+1], t*n - i);
  }
  function makeColorFn(meta, suMode) {
    const isDelta   = suMode === 'delta';
    const isDiverge = isDelta || (meta.min < 0 && meta.var_type !== 'string');
    const isZeroInfl = !isDiverge && meta.zero_fraction > 0.5;
    const lo = meta.p10 ?? meta.min, hi = meta.p90 ?? meta.max;
    if (isDiverge) {
      const absMax = Math.max(Math.abs(lo), Math.abs(hi)) || 1;
      return v => {
        if (v == null) return '#d3d3d3';
        return interpPalette(RDBU, Math.max(0, Math.min(1, (v + absMax) / (2 * absMax))));
      };
    }
    const range = (hi - lo) || 1;
    return v => {
      if (v == null) return '#d3d3d3';
      if (isZeroInfl && v === 0) return '#e8e8e8';
      return interpPalette(VIRIDIS, Math.max(0, Math.min(1, (v - lo) / range)));
    };
  }

  // ── Choropleth state ──
  let choroplethLayer = null;
  let currentMeta = null;
  let currentColorFn = null;

  // ── LISA state ──
  let lisaClasses    = null;
  let lastNumericData = null;
  let currentViewMode = 'values';

  // ── Country borders overlay ──
  let countriesData  = null;  // cached GeoJSON
  let countriesLayer = null;  // Leaflet GeoJSON layer (lives on borders pane)

  // ── Band T state ──
  let lmrData       = null;   // loaded GeoJSON + meta
  let evolv2kData   = null;   // loaded event catalog
  let hydeLayer     = null;   // current HYDE TileLayer
  let lmrNotchIndex = 0;      // 0–4
  let hydeViewMode  = 'first_epoch'; // first_epoch | persistence | current_value
  let hydeEpoch     = 7;      // 1–7 (current_value only)
  let hydeVar       = null;   // cropland | grazing | pasture | rangeland
  let evolv2kY0     = -491;
  let evolv2kY1     = 1890;
  let evolv2kSortCol = 'year';
  let evolv2kSortAsc = true;

  // LMR variable → GeoJSON property prefix mapping
  const LMR_VAR_PREFIX = {
    lmr_pdsi:           'pdsi',
    lmr_temp_anomaly:   'air',
    lmr_precip_anomaly: 'prate',
  };
  const LMR_NOTCH_LABELS = [
    'Early reliable (700–950 CE)',
    'MCA (950–1250 CE)',
    'Transition (1250–1450 CE)',
    'LIA (1450–1850 CE)',
    'Industrial (1850–1998 CE)',
  ];
  const HYDE_EPOCH_LABELS = [
    '', // 0 unused
    '10000–4000 BCE', '3000–1000 BCE', '0 CE',
    '100–1000 CE', '1100–1700 CE', '1710–1900 CE', '1910–2025 CE',
  ];

  // ── Render choropleth (Bands A–E) ──
  function renderChoropleth(data) {
    if (choroplethLayer) { map.removeLayer(choroplethLayer); choroplethLayer = null; }
    const { meta, geojson } = data;
    currentMeta = meta;
    const su = document.querySelector('input[name="ex-su"]:checked')?.value || 's';
    currentColorFn = makeColorFn(meta, su);

    choroplethLayer = L.geoJSON(geojson, {
      style: f => {
        const fill = currentColorFn(f.properties.value);
        return { fillColor: fill, fillOpacity: 0.85, weight: 0.4, color: fill, opacity: 1 };
      },
      onEachFeature: (f, layer) => {
        const v = f.properties.value;
        const disp = v != null ? `${Number(v.toFixed(4))} ${meta.units || ''}`.trim() : 'No data';
        layer.on('mouseover', function () {
          this.setStyle({ weight: 1.5, color: '#333', fillOpacity: 0.9 });
          highlightHistoBin(v);
        });
        layer.on('mouseout', function () {
          if (currentViewMode === 'lisa' && lisaClasses) {
            const id  = String(layer.feature.properties.hybas_id);
            const cls = lisaClasses[id];
            const fill = LISA_COLORS[cls] ?? '#d3d3d3';
            this.setStyle({ fillColor: fill, fillOpacity: 0.8, weight: 0.4, color: fill, opacity: 1 });
          } else {
            choroplethLayer.resetStyle(this);
            clearHistoHighlight();
          }
        });
        layer.bindTooltip(
          `<div style="font-size:0.78rem;line-height:1.4;">` +
          `<strong>Basin ${f.properties.hybas_id}</strong><br>` +
          `${disp}</div>`, { sticky: true }
        );
      }
    }).addTo(map);
  }

  // ── Render histogram (Bands A–E) ──
  function renderHistogram(data) {
    const { meta, geojson } = data;
    const el = document.getElementById('ex-histogram');
    resetHistogramEl(el);
    if (!meta.n_valid) { el.innerHTML = '<span class="text-muted small">No data</span>'; return; }

    const values = geojson.features.map(f => f.properties.value).filter(v => v != null);
    const N_BINS = 28;
    const lo = meta.p10 ?? meta.min, hi = meta.p90 ?? meta.max;
    const step = (hi - lo) / N_BINS || 1;

    const counts = new Array(N_BINS).fill(0);
    let nUnder = 0, nOver = 0;
    for (const v of values) {
      if (v < lo) { nUnder++; continue; }
      if (v > hi) { nOver++;  continue; }
      counts[Math.min(N_BINS - 1, Math.floor((v - lo) / step))]++;
    }
    const maxCount = Math.max(...counts) || 1;

    const W = el.clientWidth || 600, H = 110;
    const bw = (W - 4) / N_BINS;
    const clamp = x => Math.max(2, Math.min(W - 2, x));
    const meanX = clamp(((meta.mean   - lo) / (hi - lo)) * (W - 4) + 2);
    const medX  = clamp(((meta.median - lo) / (hi - lo)) * (W - 4) + 2);

    const bars = counts.map((c, i) => {
      const x = 2 + i * bw, binMid = lo + (i + 0.5) * step;
      const fill = currentColorFn(binMid), barH = (c / maxCount) * (H - 20), y = H - 20 - barH;
      return `<rect class="histo-bar" data-bin="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                    width="${(bw - 0.5).toFixed(1)}" height="${barH.toFixed(1)}"
                    fill="${fill}" stroke="none" opacity="0.85"/>`;
    }).join('');

    const underNote = nUnder ? `<tspan> ◂${nUnder}</tspan>` : '';
    const overNote  = nOver  ? `<tspan> ${nOver}▸</tspan>`  : '';
    el.innerHTML = `
      <svg id="ex-histo-svg" width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;">
        ${bars}
        <line x1="${meanX.toFixed(1)}" y1="0" x2="${meanX.toFixed(1)}" y2="${H-20}" stroke="#333" stroke-width="1.2" stroke-dasharray="3,2"/>
        <line x1="${medX.toFixed(1)}"  y1="0" x2="${medX.toFixed(1)}"  y2="${H-20}" stroke="#888" stroke-width="1"   stroke-dasharray="2,2"/>
        <text x="${meanX.toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="12" fill="#333">mean</text>
        <text x="${medX.toFixed(1)}"  y="${H-5}" text-anchor="middle" font-size="12" fill="#888">med</text>
        <text x="2"      y="${H-5}" font-size="12" fill="#aaa">${lo.toFixed(1)}${underNote}</text>
        <text x="${W-2}" y="${H-5}" text-anchor="end" font-size="12" fill="#aaa">${overNote}${hi.toFixed(1)}</text>
      </svg>`;
  }

  function resetHistogramEl(el) {
    el.style.height    = '130px';
    el.style.maxHeight = '';
    el.style.overflowY = '';
    el.style.padding   = '';
    el.classList.remove('ex-placeholder');
  }

  let _highlightedBin = null;
  function highlightHistoBin(v) {
    if (!currentMeta || v == null) return;
    const { p10: lo, p90: hi } = currentMeta; if (lo == null) return;
    const N = 28, step = (hi - lo) / N;
    const i = Math.min(N-1, Math.max(0, Math.floor((v - lo) / step)));
    const svg = document.getElementById('ex-histo-svg'); if (!svg) return;
    if (_highlightedBin != null) svg.querySelector(`[data-bin="${_highlightedBin}"]`)?.removeAttribute('stroke');
    const bar = svg.querySelector(`[data-bin="${i}"]`);
    if (bar) { bar.setAttribute('stroke','#111'); bar.setAttribute('stroke-width','1.5'); }
    _highlightedBin = i;
  }
  function clearHistoHighlight() {
    const svg = document.getElementById('ex-histo-svg'); if (!svg) return;
    if (_highlightedBin != null) {
      svg.querySelector(`[data-bin="${_highlightedBin}"]`)?.removeAttribute('stroke');
      _highlightedBin = null;
    }
  }

  // ── Fetch + render (numeric, Bands A–E) ──
  async function fetchAndRender() {
    if (!selectedKey) return;
    const su    = document.querySelector('input[name="ex-su"]:checked')?.value || 's';
    const level = document.querySelector('input[name="ex-level"]:checked')?.value || '6';
    const v     = allVars.find(v => v.schema_key === selectedKey);
    const month = v?.monthly_series ? document.getElementById('ex-month').value : null;
    const strip = document.getElementById('ex-var-header');
    strip.innerHTML = '<span class="text-muted fst-italic small">Loading…</span>';
    showSpinner();
    try {
      const params = new URLSearchParams({ var: selectedKey, level, su });
      if (month) params.set('month', month);
      const resp = await fetch(`/api/explorer/values?${params}`);
      if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail); }
      const data = await resp.json();
      lastNumericData = data;
      renderChoropleth(data);
      renderHistogram(data);
      const vMeta = allVars.find(v => v.schema_key === selectedKey);
      if (vMeta) updateVarHeader(vMeta, data.meta);
      const url = new URL(window.location);
      url.searchParams.set('var', selectedKey); url.searchParams.set('level', level); url.searchParams.set('su', su);
      if (month) url.searchParams.set('month', month); else url.searchParams.delete('month');
      window.history.replaceState({}, '', url);
      if (currentViewMode === 'lisa') await fetchLISA();
    } catch (err) {
      strip.innerHTML = `<span class="text-danger small">${escHtml(err.message)}</span>`;
    } finally {
      hideSpinner();
    }
  }

  // ── Fetch + render (categorical, Bands A–E) ──
  async function fetchAndRenderCategorical() {
    if (!selectedKey) return;
    const level = document.querySelector('input[name="ex-level"]:checked')?.value || '6';
    const strip = document.getElementById('ex-var-header');
    strip.innerHTML = '<span class="text-muted fst-italic small">Loading…</span>';
    showSpinner();
    try {
      const resp = await fetch(`/api/explorer/categorical?var=${encodeURIComponent(selectedKey)}&level=${level}`);
      if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail); }
      const data = await resp.json();
      renderCategoricalChoropleth(data);
      renderCategoryBars(data);
      const vMeta = allVars.find(v => v.schema_key === selectedKey);
      if (vMeta) updateVarHeader(vMeta, data.meta);
      const url = new URL(window.location);
      url.searchParams.set('var', selectedKey); url.searchParams.set('level', level);
      window.history.replaceState({}, '', url);
    } catch (err) {
      strip.innerHTML = `<span class="text-danger small">${escHtml(err.message)}</span>`;
    } finally {
      hideSpinner();

  // ── Categorical choropleth ──
  function renderCategoricalChoropleth(data) {
    if (choroplethLayer) { map.removeLayer(choroplethLayer); choroplethLayer = null; }
    const { categories, geojson } = data;
    const idToColor = Object.fromEntries(categories.map(c => [c.id, c.color]));
    const idToName  = Object.fromEntries(categories.map(c => [c.id, c.name]));
    choroplethLayer = L.geoJSON(geojson, {
      style: f => {
        const fill = idToColor[f.properties.cat_id] ?? '#aaa';
        return { fillColor: fill, fillOpacity: 0.85, weight: 0.4, color: fill, opacity: 1 };
      },
      onEachFeature: (f, layer) => {
        const name = idToName[f.properties.cat_id] ?? `Class ${f.properties.raw_id}`;
        layer.on('mouseover', function () { this.setStyle({ weight: 1.5, color: '#333', fillOpacity: 0.95 }); });
        layer.on('mouseout',  function () { choroplethLayer.resetStyle(this); });
        layer.bindTooltip(
          `<div style="font-size:0.78rem;">${escHtml(name)}<br>` +
          `<span class="text-muted">Basin ${f.properties.hybas_id}</span></div>`, { sticky: true }
        );
      }
    }).addTo(map);
  }

  // ── Category bars ──
  function renderCategoryBars(data) {
    const el = document.getElementById('ex-histogram');
    const { categories } = data;
    if (!categories?.length) { el.innerHTML = '<span class="text-muted small p-2">No data</span>'; return; }
    const maxCount = Math.max(...categories.map(c => c.count));
    const rows = categories.map(c => {
      const barW = Math.max(2, Math.round((c.count / maxCount) * 55));
      return `<tr style="line-height:1.2;">
        <td style="width:14px;"><span style="display:inline-block;width:12px;height:12px;background:${c.color};border-radius:2px;"></span></td>
        <td style="font-size:0.8rem;white-space:nowrap;overflow:hidden;max-width:120px;text-overflow:ellipsis;padding-right:4px;" title="${escHtml(c.name)}">${escHtml(c.name)}</td>
        <td style="width:60%;vertical-align:middle;"><div style="background:${c.color};height:9px;width:${barW}%;opacity:0.85;border-radius:1px;"></div></td>
        <td style="font-size:0.8rem;color:#888;white-space:nowrap;padding-left:4px;">${c.pct}%</td>
      </tr>`;
    }).join('');
    el.style.height = 'auto'; el.style.maxHeight = '140px'; el.style.overflowY = 'auto'; el.style.padding = '4px 6px';
    el.innerHTML = `<table style="width:100%;border-collapse:collapse;">${rows}</table>`;
  }

  // ── LISA ──
  async function fetchLISA() {
    if (!selectedKey || !choroplethLayer) return;
    const level = document.querySelector('input[name="ex-level"]:checked')?.value || '6';
    const strip = document.getElementById('ex-var-header');
    showSpinner();
    try {
      const resp = await fetch(`/api/explorer/lisa?var=${encodeURIComponent(selectedKey)}&level=${level}`);
      if (!resp.ok) {
        const e = await resp.json();
        document.getElementById('ex-view-values').checked = true; currentViewMode = 'values';
        if (lastNumericData) { renderChoropleth(lastNumericData); renderHistogram(lastNumericData); }
        const vMeta = allVars.find(v => v.schema_key === selectedKey);
        if (vMeta) updateVarHeader(vMeta, lastNumericData?.meta);
        strip.innerHTML += `<span class="text-warning small ms-3">⚠ LISA unavailable: ${escHtml(e.detail)}</span>`;
        return;
      }
      const data = await resp.json();
      lisaClasses = data.classes;
      applyLISAStyle();
      renderLISAHistogram(data.meta);
    } catch (err) {
      document.getElementById('ex-view-values').checked = true; currentViewMode = 'values';
      if (lastNumericData) { renderChoropleth(lastNumericData); renderHistogram(lastNumericData); }
    } finally {
      hideSpinner();
    }
  }

  function applyLISAStyle() {
    if (!choroplethLayer || !lisaClasses) return;
    choroplethLayer.eachLayer(layer => {
      const id = String(layer.feature?.properties?.hybas_id);
      const cls = lisaClasses[id];
      const fill = LISA_COLORS[cls] ?? '#d3d3d3';
      layer.setStyle({ fillColor: fill, fillOpacity: 0.8, weight: 0.4, color: fill, opacity: 1 });
    });
  }

  function renderLISAHistogram(meta) {
    const el = document.getElementById('ex-histogram');
    resetHistogramEl(el);
    const counts = meta.counts || {};
    const total  = meta.n || LISA_ORDER.reduce((s, c) => s + (counts[c] || 0), 0);
    const maxCnt = Math.max(...LISA_ORDER.map(c => counts[c] || 0), 1);
    const W = el.clientWidth || 600, H = 110;
    const bw = (W - 20) / LISA_ORDER.length;
    const bars = LISA_ORDER.map((cls, i) => {
      const cnt = counts[cls] || 0, barH = Math.max(1, (cnt / maxCnt) * (H - 30));
      const x = 10 + i * bw, y = H - 30 - barH;
      const pct = total ? (100 * cnt / total).toFixed(1) : '0';
      return `
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${barH.toFixed(1)}"
              fill="${LISA_COLORS[cls]}" stroke="#999" stroke-width="0.5" opacity="0.9"/>
        <text x="${(x+bw/2).toFixed(1)}" y="${H-15}" text-anchor="middle" font-size="12" fill="#444">${cls}</text>
        <text x="${(x+bw/2).toFixed(1)}" y="${H-3}"  text-anchor="middle" font-size="11" fill="#888">${pct}%</text>
        ${cnt ? `<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="11" fill="#555">${cnt.toLocaleString()}</text>` : ''}`;
    }).join('');
    el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;">${bars}</svg>`;
  }

  // ──────────────────────────────────────────────────
  // Band T: LMR rendering
  // ──────────────────────────────────────────────────

  async function loadCountriesOverlay() {
    if (countriesLayer) return;  // already on map
    if (!countriesData) {
      try {
        const resp = await fetch('/static/explorer/countries_110m.geojson');
        countriesData = await resp.json();
      } catch (e) { return; }
    }
    countriesLayer = L.geoJSON(countriesData, {
      pane: 'bordersPane',
      style: { weight: 0.8, color: '#555', fill: false, opacity: 0.7 },
      interactive: false,
    }).addTo(map);
  }

  async function loadAndRenderLMR() {
    if (!lmrData) {
      showSpinner();
      try {
        const resp = await fetch('/static/explorer/lmr_notches.geojson');
        lmrData = await resp.json();
      } catch (e) {
        document.getElementById('ex-var-header').innerHTML =
          '<span class="text-danger small">Failed to load LMR data</span>';
        hideSpinner();
        return;
      }
      hideSpinner();
    }
    renderLMRChoropleth();
    loadCountriesOverlay();
  }

  function lmrPercentile(sorted, p) {
    const i = Math.max(0, Math.min(sorted.length - 1, Math.round(p * sorted.length)));
    return sorted[i];
  }

  function formatLMRVal(v) {
    if (v === 0) return '0';
    const mag = Math.floor(Math.log10(Math.abs(v)));
    if (mag >= -2) return v.toFixed(3);
    return v.toExponential(2);
  }

  function renderLMRChoropleth() {
    if (choroplethLayer) { map.removeLayer(choroplethLayer); choroplethLayer = null; }
    if (hydeLayer)       { map.removeLayer(hydeLayer);       hydeLayer = null; }
    if (!lmrData)        return;

    const prefix = LMR_VAR_PREFIX[selectedKey];
    if (!prefix) return;
    const propKey = `${prefix}_${lmrNotchIndex}`;

    // LMR values are anomalies vs 1951-1980. Adjust per-cell using the pre-industrial
    // mean (notches 0–3: Early → LIA, excluding Industrial) so MCA reads warm and LIA
    // reads cold on a medieval scale, without Industrial warming inflating the baseline.
    const preIndKeys = [0, 1, 2, 3].map(i => `${prefix}_${i}`);

    const adjMap = new Map();
    for (const f of lmrData.features) {
      const preIndVals = preIndKeys.map(k => f.properties[k]).filter(v => v != null);
      if (!preIndVals.length) continue;
      const cellMean = preIndVals.reduce((a, b) => a + b, 0) / preIndVals.length;
      const raw = f.properties[propKey];
      adjMap.set(f, raw != null ? raw - cellMean : null);
    }

    // Percentile-clip at 3rd/97th to prevent outlier blowout
    const vals = [...adjMap.values()].filter(v => v != null);
    const sorted = [...vals].sort((a, b) => a - b);
    const lo = lmrPercentile(sorted, 0.03);
    const hi = lmrPercentile(sorted, 0.97);
    const absMax = Math.max(Math.abs(lo), Math.abs(hi)) || 1;

    choroplethLayer = L.geoJSON(lmrData, {
      style: f => {
        const v = adjMap.get(f);
        if (v == null) return { fillColor: 'transparent', fillOpacity: 0, weight: 0, color: 'transparent' };
        // Blue=low (negative), red=high (positive): use 1-t to reverse RDBU
        const t = Math.max(0, Math.min(1, (v + absMax) / (2 * absMax)));
        const fill = interpPalette(RDBU, 1 - t);
        return { fillColor: fill, fillOpacity: 0.70, weight: 0.2, color: '#888', opacity: 0.3 };
      },
      onEachFeature: (f, layer) => {
        const raw = f.properties[propKey];
        const adj = adjMap.get(f);
        const vMeta = allVars.find(v => v.schema_key === selectedKey);
        const units = vMeta?.units || '';
        const rawDisp = raw != null ? formatLMRVal(raw) : 'No data';
        const adjDisp = adj != null ? (adj >= 0 ? '+' : '') + formatLMRVal(adj) : '';
        layer.bindTooltip(
          `<div style="font-size:0.78rem;line-height:1.4;">` +
          `<strong>LMR cell ${f.properties.lat}°N, ${f.properties.lon}°E</strong><br>` +
          `${rawDisp}${units ? ' ' + units : ''} (vs 1951–80)` +
          (adjDisp ? `<br>${adjDisp}${units ? ' ' + units : ''} (vs pre-industrial mean)` : '') +
          `</div>`, { sticky: true }
        );
      }
    }).addTo(map);

    updateVarHeaderBandT();
    renderLMRLegend(absMax);
  }

  function renderLMRLegend(absMax) {
    const el = document.getElementById('ex-histogram');
    resetHistogramEl(el);
    el.style.height = 'auto';
    const W = el.clientWidth || 600, H = 80;
    const N = 40;
    const bars = Array.from({length: N}, (_, i) => {
      const t = i / (N - 1);
      const fill = interpPalette(RDBU, 1 - t);
      const x = 2 + i * ((W - 4) / N), bw = (W - 4) / N;
      return `<rect x="${x.toFixed(1)}" y="22" width="${(bw + 0.5).toFixed(1)}" height="32" fill="${fill}" stroke="none"/>`;
    }).join('');
    const negLabel = formatLMRVal(-absMax);
    const posLabel = formatLMRVal(+absMax);
    el.innerHTML = `
      <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;">
        ${bars}
        <text x="2"      y="17" font-size="12" fill="#333">cooler than pre-industrial mean (blue)</text>
        <text x="${W-2}" y="17" font-size="12" fill="#333" text-anchor="end">warmer than pre-industrial mean (red)</text>
        <text x="2"      y="${H-4}" font-size="12" fill="#666">${negLabel}</text>
        <text x="${W/2}" y="${H-4}" font-size="12" fill="#888" text-anchor="middle">0</text>
        <text x="${W-2}" y="${H-4}" font-size="12" fill="#666" text-anchor="end">${posLabel}</text>
      </svg>
      <p style="font-size:0.75rem;color:#666;margin:4px 2px 0;line-height:1.4;">
        Anomaly relative to each cell's pre-industrial mean (Early–LIA notches). Shown at
        native 2°×2° grid resolution — not aggregated to basins. LMR cells cover ocean as
        well as land; ocean values reflect data-assimilation infill, not direct proxy evidence.
        Proxy coverage is sparser in Asia, the Southern Hemisphere, and the tropics;
        signals in those regions carry greater reconstruction uncertainty.
        Source: LMR v2.1 (Tardif et al. 2019).
      </p>`;
  }

  // ──────────────────────────────────────────────────
  // Band T: HYDE rendering
  // ──────────────────────────────────────────────────

  function renderHYDE() {
    if (choroplethLayer) { map.removeLayer(choroplethLayer); choroplethLayer = null; }
    if (hydeLayer)       { map.removeLayer(hydeLayer);       hydeLayer = null; }

    const view = hydeViewMode === 'current_value' ? `epoch_${hydeEpoch}` : hydeViewMode;
    const tileUrl = `/static/explorer/hyde_tiles/${hydeVar}/${view}/{z}/{x}/{y}.png`;

    hydeLayer = L.tileLayer(tileUrl, {
      maxNativeZoom: 6,
      maxZoom: 10,
      opacity: 0.88,
      errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==',
      attribution: 'HYDE 3.4 (Klein Goldewijk et al. 2017)',
    }).addTo(map);

    updateVarHeaderBandT();
    renderHYDELegend();
  }

  function renderHYDELegend() {
    const el = document.getElementById('ex-histogram');
    resetHistogramEl(el);
    const W = el.clientWidth || 600, H = 90;

    if (hydeViewMode === 'first_epoch') {
      // 7 discrete colors (epoch 1–7) matching Python LUT
      const EPOCH_COLORS = [
        '#083060', '#3f007d', '#980088', '#d94801', '#ef8a07', '#a6d96a', '#ffff99'
      ];
      const labels = ['E1: pre-4000 BCE', 'E2: 3000–1000 BCE', 'E3: 0 CE',
                      'E4: 100–1000', 'E5: 1100–1700', 'E6: 1710–1900', 'E7: 1910+'];
      const bw = (W - 4) / 7;
      const bars = EPOCH_COLORS.map((c, i) => {
        const x = 2 + i * bw;
        return `<rect x="${x.toFixed(1)}" y="20" width="${bw.toFixed(1)}" height="28" fill="${c}"/>
                <text x="${(x + bw/2).toFixed(1)}" y="${H-2}" font-size="7.5" text-anchor="middle" fill="#555">${labels[i]}</text>`;
      }).join('');
      el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;">${bars}</svg>`;

    } else if (hydeViewMode === 'persistence') {
      // 8 steps 0–7, yellow→blue
      const PERSIST_COLORS = ['#ffffff','#ffffcc','#c7e9b4','#7fcdbb','#41b6c4','#1d91c0','#225ea8','#0c2c84'];
      const bw = (W - 4) / 8;
      const bars = PERSIST_COLORS.map((c, i) => {
        const x = 2 + i * bw;
        return `<rect x="${x.toFixed(1)}" y="20" width="${bw.toFixed(1)}" height="28" fill="${c}" stroke="#aaa" stroke-width="0.3"/>
                <text x="${(x + bw/2).toFixed(1)}" y="${H-2}" font-size="9" text-anchor="middle" fill="#555">${i}</text>`;
      }).join('');
      el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;">
        <text x="${W/2}" y="14" font-size="9" text-anchor="middle" fill="#555">Epoch count (0 = never, 7 = all epochs)</text>
        ${bars}
      </svg>`;

    } else {
      // current_value: continuous sequential
      const isCrop = hydeVar === 'cropland';
      const lo = isCrop ? '#e5f5e0' : '#fff7ec', hi = isCrop ? '#006d2c' : '#7f2704';
      const N = 40;
      const bars = Array.from({length: N}, (_, i) => {
        const t = i / (N - 1);
        const r = i => parseInt(lo.slice(1,3),16) + (parseInt(hi.slice(1,3),16) - parseInt(lo.slice(1,3),16)) * t | 0;
        const g = parseInt(lo.slice(3,5),16) + (parseInt(hi.slice(3,5),16) - parseInt(lo.slice(3,5),16)) * t | 0;
        const b = parseInt(lo.slice(5,7),16) + (parseInt(hi.slice(5,7),16) - parseInt(lo.slice(5,7),16)) * t | 0;
        const fill = `rgb(${parseInt(lo.slice(1,3),16) + Math.round((parseInt(hi.slice(1,3),16)-parseInt(lo.slice(1,3),16))*t)},${parseInt(lo.slice(3,5),16) + Math.round((parseInt(hi.slice(3,5),16)-parseInt(lo.slice(3,5),16))*t)},${parseInt(lo.slice(5,7),16) + Math.round((parseInt(hi.slice(5,7),16)-parseInt(lo.slice(5,7),16))*t)})`;
        const x = 2 + i * ((W-4)/N);
        return `<rect x="${x.toFixed(1)}" y="20" width="${((W-4)/N + 0.5).toFixed(1)}" height="30" fill="${fill}"/>`;
      }).join('');
      el.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;">
        <text x="${W/2}" y="14" font-size="9" text-anchor="middle" fill="#555">Mean fraction (${HYDE_EPOCH_LABELS[hydeEpoch]})</text>
        ${bars}
        <text x="2"      y="${H-2}" font-size="9" fill="#888">0</text>
        <text x="${W-2}" y="${H-2}" font-size="9" fill="#888" text-anchor="end">1.0</text>
      </svg>`;
    }
  }

  // ──────────────────────────────────────────────────
  // Band T: eVolv2k rendering
  // ──────────────────────────────────────────────────

  async function loadAndRenderEvolv2k() {
    if (!evolv2kData) {
      showSpinner();
      try {
        const resp = await fetch('/api/explorer/evolv2k');
        const j = await resp.json();
        evolv2kData = j.events;
      } catch (e) {
        document.getElementById('ex-var-header').innerHTML =
          '<span class="text-danger small">Failed to load eVolv2k data</span>';
        hideSpinner();
        return;
      }
      hideSpinner();
    }
    renderEvolv2k();
  }

  function renderEvolv2k() {
    const filtered = (evolv2kData || []).filter(e => e.year >= evolv2kY0 && e.year <= evolv2kY1);
    updateVarHeaderBandT(filtered.length);
    renderEvolv2kChart(filtered);
    renderEvolv2kTable(filtered);
  }

  function renderEvolv2kChart(events) {
    const el = document.getElementById('ex-evolv-chart');
    if (!events.length) { el.innerHTML = '<div class="text-muted small p-2">No events in selected range</div>'; return; }

    const W = el.clientWidth || 700, H = 240;
    const PAD = { t: 20, r: 20, b: 30, l: 40 };
    const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;

    // Axes
    const xMin = evolv2kY0, xMax = evolv2kY1;
    const yMin = -90, yMax = 90;
    const maxVSSI = Math.max(...events.map(e => e.vssi_tg), 1);

    const xScale = v => PAD.l + (v - xMin) / (xMax - xMin) * plotW;
    const yScale = v => PAD.t + (1 - (v - yMin) / (yMax - yMin)) * plotH;
    const rScale = v => Math.max(3, Math.min(18, (v / maxVSSI) * 16 + 2));

    // Color by year (dark blue = ancient, gold = recent)
    function yearColor(y) {
      const t = Math.max(0, Math.min(1, (y - xMin) / (xMax - xMin)));
      return interpPalette(['#1a1a6e','#4575b4','#91bfdb','#fee090','#d73027'], t);
    }

    // Grid lines for latitudes
    const latLines = [-45, 0, 45].map(lat => {
      const y = yScale(lat);
      return `<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W - PAD.r}" y2="${y.toFixed(1)}"
                    stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3,3"/>
              <text x="${PAD.l - 3}" y="${(y+3).toFixed(1)}" font-size="8" text-anchor="end" fill="#aaa">${lat}°</text>`;
    }).join('');

    // X axis ticks
    const yearSpan = xMax - xMin;
    const tickStep = yearSpan > 1000 ? 500 : yearSpan > 200 ? 100 : 50;
    const firstTick = Math.ceil(xMin / tickStep) * tickStep;
    const xTicks = [];
    for (let y = firstTick; y <= xMax; y += tickStep) {
      const x = xScale(y);
      xTicks.push(`<line x1="${x.toFixed(1)}" y1="${(H-PAD.b).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(H-PAD.b+4).toFixed(1)}" stroke="#aaa"/>
                   <text x="${x.toFixed(1)}" y="${H-3}" font-size="8" text-anchor="middle" fill="#888">${y}</text>`);
    }

    // Event circles — sort by vssi ascending so large events render on top
    const sorted = [...events].sort((a, b) => a.vssi_tg - b.vssi_tg);
    const circles = sorted.map(e => {
      const cx = xScale(e.year), cy = yScale(e.lat ?? 0), r = rScale(e.vssi_tg);
      const fill = yearColor(e.year);
      const loc = e.location ? escHtml(e.location) : '(unknown)';
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"
                      fill="${fill}" stroke="#333" stroke-width="0.5" opacity="0.85">
                <title>${e.year} CE · ${loc} · VSSI ${e.vssi_tg} Tg · lat ${e.lat ?? '?'}°</title>
              </circle>`;
    }).join('');

    // Axis labels
    el.innerHTML = `
      <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;font-family:sans-serif;">
        <!-- Y axis line + label -->
        <line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${H-PAD.b}" stroke="#ccc"/>
        <text x="${PAD.l - 20}" y="${(H/2).toFixed(1)}" font-size="8" text-anchor="middle" fill="#aaa"
              transform="rotate(-90,${PAD.l - 20},${H/2})">Lat °N</text>
        <!-- X axis line -->
        <line x1="${PAD.l}" y1="${H-PAD.b}" x2="${W-PAD.r}" y2="${H-PAD.b}" stroke="#ccc"/>
        ${latLines}
        ${xTicks.join('')}
        ${circles}
        <!-- Y axis ticks -->
        <text x="${(PAD.l-3).toFixed(1)}" y="${(yScale(90)+3).toFixed(1)}"  font-size="8" text-anchor="end" fill="#aaa">90°N</text>
        <text x="${(PAD.l-3).toFixed(1)}" y="${(yScale(-90)+3).toFixed(1)}" font-size="8" text-anchor="end" fill="#aaa">90°S</text>
      </svg>
      <div style="font-size:0.68rem;color:#aaa;padding:0 0 2px 40px;">
        Circle size = VSSI magnitude · Y = approximate source latitude (lat=0/±45 = default for unlocated events) · Color = age
      </div>`;
  }

  function renderEvolv2kTable(events) {
    const tbody = document.getElementById('ex-evolv-tbody');
    if (!events.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center py-2">No events</td></tr>'; return; }

    const sorted = [...events].sort((a, b) =>
      evolv2kSortAsc
        ? (a[evolv2kSortCol] ?? -Infinity) - (b[evolv2kSortCol] ?? -Infinity)
        : (b[evolv2kSortCol] ?? -Infinity) - (a[evolv2kSortCol] ?? -Infinity)
    );

    const maxVSSI = Math.max(...sorted.map(e => e.vssi_tg), 1);
    tbody.innerHTML = sorted.map(e => {
      const dotColor = `hsl(${Math.round(240 - (e.vssi_tg / maxVSSI) * 180)},70%,45%)`;
      const loc = e.location ? escHtml(e.location) : '<span class="text-muted">—</span>';
      const sig = e.vssi_1sig != null ? e.vssi_1sig.toFixed(2) : '—';
      const asy = e.asymmetry != null ? e.asymmetry.toFixed(3) : '—';
      const tep = e.tephra ? '✓' : '—';
      return `<tr>
        <td>${e.year} CE</td>
        <td>${loc}</td>
        <td><span class="evolv-dot" style="background:${dotColor}"></span>${e.vssi_tg.toFixed(2)}</td>
        <td>${sig}</td>
        <td>${asy}</td>
        <td style="color:#aaa;">${tep}</td>
      </tr>`;
    }).join('');
  }

  // ──────────────────────────────────────────────────
  // Variable header strip
  // ──────────────────────────────────────────────────

  function updateVarHeader(v, meta) {
    const strip = document.getElementById('ex-var-header');
    strip.classList.remove('fst-italic', 'text-muted');
    const units = meta?.units || v.units || '';
    strip.innerHTML =
      `<span class="fw-semibold">${escHtml(v.friendly_name)}</span>` +
      `<span class="text-muted ms-2" style="font-size:0.75rem;">${escHtml(v.schema_key)}</span>` +
      (units ? `<span class="text-muted ms-2" style="font-size:0.75rem;">[${escHtml(units)}]</span>` : '');
  }

  function updateVarHeaderBandT(count) {
    const v = allVars.find(v => v.schema_key === selectedKey);
    if (!v) return;
    const strip = document.getElementById('ex-var-header');
    strip.classList.remove('fst-italic', 'text-muted');
    let detail = '';
    if (v.t_subsystem === 'lmr') {
      detail = `<span class="text-muted ms-2" style="font-size:0.75rem;">LMR v2.1 · 2°×2° native grid · ${escHtml(LMR_NOTCH_LABELS[lmrNotchIndex])}</span>`;
    } else if (v.t_subsystem === 'hyde') {
      const viewLabel = hydeViewMode === 'first_epoch' ? 'First epoch' :
                        hydeViewMode === 'persistence' ? 'Persistence (7 epochs)' :
                        `Epoch ${hydeEpoch}: ${HYDE_EPOCH_LABELS[hydeEpoch]}`;
      detail = `<span class="text-muted ms-2" style="font-size:0.75rem;">HYDE 3.4 · 5-arcmin native grid · ${escHtml(viewLabel)}</span>`;
    } else if (v.t_subsystem === 'evolv2k') {
      const countStr = count != null ? ` · ${count} event${count !== 1 ? 's' : ''}` : '';
      detail = `<span class="text-muted ms-2" style="font-size:0.75rem;">eVolv2k v4 · ${evolv2kY0}–${evolv2kY1} CE${escHtml(countStr)}</span>`;
    }
    strip.innerHTML =
      `<span class="fw-semibold">${escHtml(v.friendly_name)}</span>` +
      `<span class="text-muted ms-2" style="font-size:0.75rem;">${escHtml(v.schema_key)}</span>` +
      detail;
  }

  // ──────────────────────────────────────────────────
  // Constants & state
  // ──────────────────────────────────────────────────

  const BAND_NAMES = {
    A: 'Physiographic bedrock', B: 'Hydro-climatic baselines',
    C: 'Bioclimatic proxies',   D: 'Anthropocene markers',
    E: 'Coastality',            T: 'Temporal context',
  };
  const BAND_ORDER = ['A', 'B', 'C', 'D', 'E', 'T'];

  let allVars = [];
  let selectedKey = null;
  let filterSearch = '';
  let filterStatus = 'all';
  let filterClass = '';

  // ── Load codebook ──
  async function loadCodebook() {
    try {
      const resp = await fetch('/api/explorer/codebook');
      allVars = await resp.json();
      renderAccordion();
    } catch (e) {
      document.getElementById('ex-accordion').innerHTML =
        '<div class="text-danger small p-2">Failed to load variables</div>';
    }
  }

  // ── Filter ──
  function filteredVars() {
    const term = filterSearch.toLowerCase();
    return allVars.filter(v => {
      if (v.hide_in_explorer) return false;
      if (filterStatus !== 'all' && v.status !== filterStatus) return false;
      if (filterClass && v.typology_cluster !== filterClass) return false;
      if (term) {
        return (v.schema_key || '').toLowerCase().includes(term) ||
               (v.friendly_name || '').toLowerCase().includes(term) ||
               (v.dimension || '').toLowerCase().includes(term);
      }
      return true;
    });
  }

  // ── Render accordion ──
  function renderAccordion() {
    const acc = document.getElementById('ex-accordion');
    const vars = filteredVars();
    if (!vars.length) { acc.innerHTML = '<div class="text-muted small p-2">No variables match filters</div>'; return; }

    const bands = {};
    for (const band of BAND_ORDER) {
      const bvars = vars.filter(v => v.band === band);
      if (!bvars.length) continue;
      const dims = {};
      for (const v of bvars) {
        const dim = v.dimension || 'other';
        (dims[dim] = dims[dim] || []).push(v);
      }
      for (const dim of Object.keys(dims)) {
        dims[dim].sort((a, b) => (a.status === 'implemented' ? 0 : 1) - (b.status === 'implemented' ? 0 : 1));
      }
      bands[band] = dims;
    }

    let html = '';
    for (const [band, dims] of Object.entries(bands)) {
      const totalCount = Object.values(dims).flat().length;
      const collapseId = `ex-band-${band}`;
      html += `
        <div class="accordion-item border-0">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="false">
              <strong class="me-1">${band}</strong>
              <span class="text-muted me-auto" style="font-size:0.75rem;">— ${BAND_NAMES[band]}</span>
              <span class="badge bg-secondary-subtle text-dark ms-2" style="font-size:0.7rem;">${totalCount}</span>
            </button>
          </h2>
          <div id="${collapseId}" class="accordion-collapse collapse" data-bs-parent="#ex-accordion">
            <div class="accordion-body">`;

      for (const [dim, dvars] of Object.entries(dims)) {
        const dimLabel = dim.replace(/_/g, ' ');
        html += `<details class="ex-dim"><summary>${dimLabel} <span class="text-muted" style="font-size:0.7rem;">(${dvars.length})</span></summary>`;
        for (const v of dvars) {
          const isSelected = v.schema_key === selectedKey;
          const isPreview  = v.queryable && v.status === 'planned';
          const isNoData   = !v.queryable;
          const isCat      = v.type === 'string';
          const isSU       = v.s_u === 's+u' && !isCat;
          let tags = '';
          if (isSU)      tags += `<span class="ex-var-tag ms-1">(s, u)</span>`;
          if (isCat)     tags += `<span class="ex-var-tag ms-1">(c)</span>`;
          if (isPreview) tags += `<span class="ex-var-tag preview-tag ms-1">(preview)</span>`;
          const cls = ['ex-var-item', isSelected ? 'selected' : '', isPreview ? 'preview' : '', isNoData ? 'no-data' : ''].filter(Boolean).join(' ');
          html += `<div class="${cls}" data-key="${v.schema_key}" title="${isNoData ? 'No data available' : ''}">
                     ${escHtml(v.friendly_name || v.schema_key)}${tags}
                   </div>`;
        }
        html += `</details>`;
      }
      html += `</div></div></div>`;
    }

    acc.innerHTML = html;
    acc.querySelectorAll('.ex-var-item:not(.no-data)').forEach(el => {
      el.addEventListener('click', () => selectVar(el.dataset.key));
    });
  }

  // ── Select a variable ──
  function selectVar(key) {
    selectedKey = key;
    document.querySelectorAll('.ex-var-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.key === key);
    });
    const v = allVars.find(v => v.schema_key === key);
    const subsystem = v?.t_subsystem || null;

    // IDs for control strip groups (A–E vs Band T)
    const AE_IDS = ['ex-su-toggle', 'ex-month-wrap', 'ex-view-mode-wrap', 'ex-level-wrap'];
    const BT_IDS = ['ex-lmr-notch', 'ex-hyde-view', 'ex-evolv-range'];

    if (subsystem) {
      // Hide all A–E controls
      AE_IDS.forEach(id => document.getElementById(id)?.classList.add('d-none'));
      // Hide all Band T controls, then show appropriate one
      BT_IDS.forEach(id => document.getElementById(id)?.classList.add('d-none'));
      if (subsystem === 'lmr')     document.getElementById('ex-lmr-notch').classList.remove('d-none');
      if (subsystem === 'hyde')    document.getElementById('ex-hyde-view').classList.remove('d-none');
      if (subsystem === 'evolv2k') document.getElementById('ex-evolv-range').classList.remove('d-none');

      // Manage map / histogram / evolv panel visibility
      const isEvolv = subsystem === 'evolv2k';
      document.getElementById('ex-map').style.display       = isEvolv ? 'none' : '';
      document.getElementById('ex-histogram').style.display  = isEvolv ? 'none' : '';
      document.getElementById('ex-evolv-panel').classList.toggle('d-none', !isEvolv);

      // Clear prior layers from other subsystems
      if (choroplethLayer && subsystem !== 'lmr') { map.removeLayer(choroplethLayer); choroplethLayer = null; }
      if (hydeLayer       && subsystem !== 'hyde') { map.removeLayer(hydeLayer);       hydeLayer = null; }

      lisaClasses = null;

      // Route to subsystem renderer
      if (subsystem === 'lmr') {
        loadAndRenderLMR();
      } else if (subsystem === 'hyde') {
        hydeVar = key.replace('hyde_', '');
        renderHYDE();
      } else if (subsystem === 'evolv2k') {
        loadAndRenderEvolv2k();
      }

    } else {
      // Restore A–E controls
      BT_IDS.forEach(id => document.getElementById(id)?.classList.add('d-none'));
      document.getElementById('ex-view-mode-wrap')?.classList.remove('d-none');
      document.getElementById('ex-level-wrap')?.classList.remove('d-none');

      // Restore map / histogram, hide evolv panel
      document.getElementById('ex-map').style.display      = '';
      document.getElementById('ex-histogram').style.display = '';
      document.getElementById('ex-evolv-panel').classList.add('d-none');

      // Remove Band T layers
      if (hydeLayer)       { map.removeLayer(hydeLayer);       hydeLayer = null; }
      if (countriesLayer)  { map.removeLayer(countriesLayer);  countriesLayer = null; }

      // s/u toggle
      const suToggle = document.getElementById('ex-su-toggle');
      if (v?.s_u === 's+u' && v?.type !== 'string') suToggle.classList.remove('d-none');
      else { suToggle.classList.add('d-none'); document.getElementById('ex-su-s').checked = true; }

      // Month selector
      const monthWrap = document.getElementById('ex-month-wrap');
      if (v?.monthly_series) monthWrap.classList.remove('d-none');
      else monthWrap.classList.add('d-none');

      // LISA toggle
      const lisaRadio = document.getElementById('ex-view-lisa');
      const lisaLabel = lisaRadio.nextElementSibling;
      if (v?.type === 'string') {
        lisaRadio.disabled = true; lisaLabel.title = 'LISA not available for categorical variables';
        document.getElementById('ex-view-values').checked = true; currentViewMode = 'values';
      } else if (v?.monthly_series) {
        lisaRadio.disabled = true; lisaLabel.title = 'LISA not available for monthly series';
        document.getElementById('ex-view-values').checked = true; currentViewMode = 'values';
      } else {
        lisaRadio.disabled = false; lisaLabel.title = '';
      }
      lisaClasses = null;

      if (v?.type === 'string') fetchAndRenderCategorical();
      else fetchAndRender();
    }
  }

  // ── Filter listeners ──
  document.getElementById('ex-search-box').addEventListener('input', e => { filterSearch = e.target.value.trim(); renderAccordion(); });
  document.querySelectorAll('input[name="ex-status"]').forEach(el => { el.addEventListener('change', e => { filterStatus = e.target.value; renderAccordion(); }); });
  document.getElementById('ex-class-select').addEventListener('change', e => { filterClass = e.target.value; renderAccordion(); });

  // ── Values / LISA toggle ──
  document.querySelectorAll('input[name="ex-view"]').forEach(el => {
    el.addEventListener('change', e => {
      currentViewMode = e.target.value;
      if (currentViewMode === 'lisa') {
        fetchLISA();
      } else {
        lisaClasses = null;
        if (lastNumericData) { renderChoropleth(lastNumericData); renderHistogram(lastNumericData); }
      }
    });
  });

  // ── A–E change handlers ──
  document.querySelectorAll('input[name="ex-su"]').forEach(el => { el.addEventListener('change', () => { if (selectedKey) fetchAndRender(); }); });
  document.querySelectorAll('input[name="ex-level"]').forEach(el => { el.addEventListener('change', () => { if (selectedKey) fetchAndRender(); }); });
  document.getElementById('ex-month').addEventListener('change', () => { if (selectedKey) fetchAndRender(); });

  // ── Band T change handlers ──
  document.querySelectorAll('input[name="ex-lmr-period"]').forEach(el => {
    el.addEventListener('change', e => { lmrNotchIndex = parseInt(e.target.value); renderLMRChoropleth(); });
  });

  document.querySelectorAll('input[name="ex-hyde-viewmode"]').forEach(el => {
    el.addEventListener('change', e => {
      hydeViewMode = e.target.value;
      const epochWrap = document.getElementById('ex-hyde-epoch-wrap');
      epochWrap.classList.toggle('d-none', hydeViewMode !== 'current_value');
      if (hydeVar) renderHYDE();
    });
  });

  document.getElementById('ex-hyde-epoch').addEventListener('change', e => {
    hydeEpoch = parseInt(e.target.value);
    if (hydeVar && hydeViewMode === 'current_value') renderHYDE();
  });

  document.getElementById('ex-evolv-apply').addEventListener('click', () => {
    const y0 = parseInt(document.getElementById('ex-evolv-y0').value);
    const y1 = parseInt(document.getElementById('ex-evolv-y1').value);
    if (!isNaN(y0) && !isNaN(y1) && y0 <= y1) {
      evolv2kY0 = y0; evolv2kY1 = y1;
      if (evolv2kData) renderEvolv2k();
    }
  });

  // eVolv2k table sort
  document.getElementById('ex-evolv-table').querySelector('thead').addEventListener('click', e => {
    const th = e.target.closest('th[data-col]');
    if (!th) return;
    const col = th.dataset.col;
    if (evolv2kSortCol === col) evolv2kSortAsc = !evolv2kSortAsc;
    else { evolv2kSortCol = col; evolv2kSortAsc = true; }
    if (evolv2kData) {
      const filtered = evolv2kData.filter(e => e.year >= evolv2kY0 && e.year <= evolv2kY1);
      renderEvolv2kTable(filtered);
    }
  });

  // ── Restore from URL ──
  function restoreFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const varKey = params.get('var');
    const su    = params.get('su');
    const level = params.get('level');
    if (su    && document.getElementById(`ex-su-${su}`))        document.getElementById(`ex-su-${su}`).checked        = true;
    if (level && document.getElementById(`ex-level-${level}`)) document.getElementById(`ex-level-${level}`).checked   = true;
    const month = params.get('month');
    if (month) document.getElementById('ex-month').value = month;
    if (varKey) {
      const v = allVars.find(v => v.schema_key === varKey);
      if (v) {
        const collapseEl = document.getElementById(`ex-band-${v.band}`);
        if (collapseEl) new bootstrap.Collapse(collapseEl, { toggle: true });
        selectVar(varKey);
      }
    }
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──
  loadCodebook().then(restoreFromUrl);

})();
</script>
</body>
</html>
