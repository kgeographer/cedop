<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explorer | Computing Place</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5K56B8BCD9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5K56B8BCD9');
  </script>
  <style>
    body { font-size: 1rem; }

    /* ── Layout ── */
    #ex-left  { position: sticky; top: 1rem; overflow-y: auto; max-height: calc(100vh - 5rem); }
    #ex-right { display: flex; flex-direction: column; }

    /* ── Placeholder borders (remove once filled in) ── */
    .ex-placeholder {
      border: 1px dashed #bbb;
      border-radius: 4px;
      color: #aaa;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Tabs ── */
    #ex-tabs .nav-link { font-size: 0.85rem; padding: 0.3rem 0.75rem; }
    #ex-tabs .nav-link.disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    /* ── Control strip ── */
    #ex-controls { font-size: 0.85rem; background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 0.35rem 0.6rem; }

    /* ── Variable header strip ── */
    #ex-var-header {
      font-size: 0.8rem;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      padding: 0.3rem 0.6rem;
      min-height: 2rem;
    }

    /* ── Map ── */
    #ex-map { flex: 1; min-height: 420px; }

    /* ── Histogram strip ── */
    #ex-histogram { height: 110px; border-top: 1px solid #dee2e6; }

    /* ── Left column: search / filters ── */
    #ex-search-box { font-size: 0.85rem; }
    #ex-status-filter .btn { font-size: 0.8rem; padding: 0.2rem 0.5rem; }
    #ex-class-filter select { font-size: 0.8rem; }
  </style>
</head>
<body>

<header class="mb-2">
  <h4 class="d-flex align-items-center justify-content-between py-2 border-bottom">
    <span>
      <a href="/"><img src="/static/images/cp_01_800w.jpg" alt="Computing Place" style="height:48px;" class="me-2"></a>
      <a href="/edops" class="text-decoration-none text-reset">EDOPS</a>
      <span class="text-muted mx-2">/</span>
      <span class="text-secondary me-1">Sandbox:</span>
      <a href="/sandbox/lookup" class="text-decoration-none text-secondary me-1">Lookup</a>
      <span class="text-muted me-1">|</span>
      <strong>Explorer</strong>
    </span>
    <span class="d-flex align-items-center gap-3">
      <span class="badge bg-secondary-subtle text-dark fw-normal" style="font-size:0.85rem;">EDOPS v0.2 Alpha</span>
    </span>
  </h4>
</header>

<div class="container-fluid px-3">
  <div class="row g-3">

    <!-- ===================== LEFT COLUMN: variable selector ===================== -->
    <div class="col-md-3" id="ex-left">

      <!-- Search -->
      <div class="mb-2">
        <input type="text" id="ex-search-box" class="form-control form-control-sm"
               placeholder="search variables…">
      </div>

      <!-- Status filter -->
      <div id="ex-status-filter" class="btn-group w-100 mb-2" role="group" aria-label="Status filter">
        <input type="radio" class="btn-check" name="ex-status" id="ex-status-all" value="all" checked autocomplete="off">
        <label class="btn btn-outline-secondary" for="ex-status-all">All</label>
        <input type="radio" class="btn-check" name="ex-status" id="ex-status-impl" value="implemented" autocomplete="off">
        <label class="btn btn-outline-secondary" for="ex-status-impl">Implemented</label>
        <input type="radio" class="btn-check" name="ex-status" id="ex-status-plan" value="planned" autocomplete="off">
        <label class="btn btn-outline-secondary" for="ex-status-plan">Planned</label>
      </div>

      <!-- Class filter -->
      <div id="ex-class-filter" class="d-flex align-items-center gap-1 mb-2">
        <select id="ex-class-select" class="form-select form-select-sm">
          <option value="">All classes</option>
          <option value="continental-gradient">Continental-gradient</option>
          <option value="scale-dependent">Scale-dependent</option>
          <option value="network-topology">Network-topology</option>
          <option value="local-anomaly">Local-anomaly</option>
        </select>
        <i class="bi bi-question-circle text-muted" style="cursor:help;" title="Typology class describes each variable's spatial structure: Continental-gradient = large-scale geographic patterning; Scale-dependent = changes with basin size; Network-topology = shaped by river network; Local-anomaly = isolated pockets."></i>
      </div>

      <!-- Variable accordion (placeholder) -->
      <div id="ex-accordion" class="ex-placeholder" style="height: 500px;">
        variable accordion — coming next
      </div>

    </div><!-- /left col -->

    <!-- ===================== RIGHT COLUMN: map + diagnostics + compare ===================== -->
    <div class="col-md-9" id="ex-right">

      <!-- Tab bar -->
      <ul class="nav nav-tabs mb-0" id="ex-tabs">
        <li class="nav-item">
          <button class="nav-link active" id="ex-tab-map" data-bs-toggle="tab" data-bs-target="#ex-pane-map" type="button">Map</button>
        </li>
        <li class="nav-item">
          <button class="nav-link disabled" id="ex-tab-diag" type="button" title="Not implemented in this build">Diagnostics</button>
        </li>
        <li class="nav-item">
          <button class="nav-link disabled" id="ex-tab-compare" type="button" title="Not implemented in this build">Compare</button>
        </li>
      </ul>

      <div class="tab-content border border-top-0 rounded-bottom" style="flex:1; display:flex; flex-direction:column;">

        <!-- ── Map pane ── -->
        <div class="tab-pane fade show active" id="ex-pane-map" style="flex:1; display:flex; flex-direction:column;">

          <!-- Control strip -->
          <div id="ex-controls" class="d-flex align-items-center gap-3">

            <!-- s/u/Δ toggle (hidden until variable with s+u selected) -->
            <div id="ex-su-toggle" class="btn-group btn-group-sm d-none" role="group" aria-label="s/u toggle">
              <input type="radio" class="btn-check" name="ex-su" id="ex-su-s" value="s" checked autocomplete="off">
              <label class="btn btn-outline-secondary" for="ex-su-s">s</label>
              <input type="radio" class="btn-check" name="ex-su" id="ex-su-u" value="u" autocomplete="off">
              <label class="btn btn-outline-secondary" for="ex-su-u">u</label>
              <input type="radio" class="btn-check" name="ex-su" id="ex-su-delta" value="delta" autocomplete="off">
              <label class="btn btn-outline-secondary" for="ex-su-delta">Δ</label>
            </div>

            <!-- Values/LISA toggle -->
            <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
              <input type="radio" class="btn-check" name="ex-view" id="ex-view-values" value="values" checked autocomplete="off">
              <label class="btn btn-outline-secondary" for="ex-view-values">Values</label>
              <input type="radio" class="btn-check" name="ex-view" id="ex-view-lisa" value="lisa" autocomplete="off">
              <label class="btn btn-outline-secondary" for="ex-view-lisa">LISA</label>
            </div>

            <!-- Level radio -->
            <div class="d-flex align-items-center gap-1">
              <span class="text-muted">Level:</span>
              <div class="btn-group btn-group-sm" role="group" aria-label="Basin level">
                <input type="radio" class="btn-check" name="ex-level" id="ex-level-6" value="6" checked autocomplete="off">
                <label class="btn btn-outline-secondary" for="ex-level-6">L6</label>
                <input type="radio" class="btn-check" name="ex-level" id="ex-level-8" value="8" autocomplete="off">
                <label class="btn btn-outline-secondary" for="ex-level-8">L8</label>
              </div>
            </div>

          </div><!-- /control strip -->

          <!-- Variable header strip -->
          <div id="ex-var-header" class="text-muted fst-italic">
            No variable selected
          </div>

          <!-- Map -->
          <div id="ex-map"></div>

          <!-- Histogram strip -->
          <div id="ex-histogram" class="ex-placeholder">
            histogram + legend — coming soon
          </div>

        </div><!-- /map pane -->

      </div><!-- /tab-content -->

    </div><!-- /right col -->

  </div><!-- /row -->
</div><!-- /container -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
(function () {
  // ── Leaflet map ──
  const map = L.map('ex-map', { zoomControl: true }).setView([20, 10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  // ── Placeholder: no-variable state ──
  // Map renders OSM at global zoom; choropleth layer added here once variable selected.

})();
</script>
</body>
</html>
