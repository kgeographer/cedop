<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="680" height="500" fill="#ffffff"/>

<!-- Input query -->
<rect x="230" y="28" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Location query</text>

<!-- Arrow down -->
<line x1="340" y1="72" x2="340" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Full signature container -->
<rect x="68" y="102" width="544" height="148" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Full environmental signature</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">~50 variables, always computed in full</text>

<!-- Band pills -->
<rect x="90" y="166" width="68" height="24" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="124" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">A physio</text>

<rect x="170" y="166" width="72" height="24" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="206" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">B hydro</text>

<rect x="254" y="166" width="74" height="24" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="291" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#27500A">C bioclim</text>

<rect x="340" y="166" width="72" height="24" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="376" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">D anthro</text>

<rect x="424" y="166" width="68" height="24" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="458" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">E coast</text>

<rect x="504" y="166" width="84" height="24" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="546" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">F temporal</text>

<!-- s/u and coastality notes -->
<text x="340" y="218" text-anchor="middle" font-size="12" fill="#888780">Local (s) + upstream (u) duality throughout</text>
<text x="340" y="236" text-anchor="middle" font-size="12" fill="#888780">Coastality, ecoregion membership included</text>

<!-- Lens selection bar -->
<rect x="100" y="268" width="480" height="28" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Lens selects variables, framing, and output mode by question type</text>

<!-- Fan-out arrows -->
<line x1="170" y1="296" x2="130" y2="320" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="280" y1="296" x2="288" y2="320" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="400" y1="296" x2="418" y2="320" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510" y1="296" x2="568" y2="320" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Lens 1: Paradox -->
<rect x="40" y="322" width="148" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="114" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Paradox</text>
<text x="114" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Bands A+B, s/u</text>
<text x="114" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Narrative output</text>

<!-- Lens 2: Patterns -->
<rect x="204" y="322" width="148" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="278" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Patterns</text>
<text x="278" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">All bands, stats</text>
<text x="278" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Clustering output</text>

<!-- Lens 3: Landscape -->
<rect x="368" y="322" width="148" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="442" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Landscape</text>
<text x="442" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">A+C, ecoregion</text>
<text x="442" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Hierarchy nav</text>

<!-- Lens 4: Platform -->
<rect x="532" y="322" width="108" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="586" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Platform</text>
<text x="586" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Compact JSON</text>
<text x="586" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">API payload</text>

<!-- Bottom annotation -->
<text x="340" y="444" text-anchor="middle" font-size="12" fill="#888780">One instrument, multiple lenses</text>
<text x="340" y="464" text-anchor="middle" font-size="12" fill="#888780">Rubric lives in the query, not in the service</text>

</svg>
